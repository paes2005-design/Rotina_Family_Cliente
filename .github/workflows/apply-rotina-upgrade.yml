name: Apply Rotina Family upgrade
on:
  push:
    paths:
      - .github/workflows/apply-rotina-upgrade.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated files
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payloads = {
              'index-CLIENTE-v6.html': '[... ELLIPSIZATION ...]',
              'sw.js': '',
              'README.md': '',
          }
          for path, payload in payloads.items():
              Path(path).write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Improve rankings rewards offline mode and documentation"
          git push
