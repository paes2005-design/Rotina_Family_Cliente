name: Apply Rotina Family Cliente v7
on:
  push:
    paths:
      - .github/workflows/apply-rotina-upgrade.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and validate Cliente
        shell: bash
        run: |
          cat .upgrade-v7/01.txt .upgrade-v7/02.txt > /tmp/payload.txt
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(Path('/tmp/payload.txt').read_text()))
          expected='36ff1d256c905d60d88605eceb766aebe1eb63108db54419165f9fc653335dbe'
          got=hashlib.sha256(raw).hexdigest()
          assert got==expected,(got,expected)
          text=raw.decode('utf-8')
          assert 'Meus resgates' in text and 'Minhas justificativas' in text
          assert 'persistentLocalCache' in text
          Path('index-CLIENTE-v6.html').write_bytes(raw)
          PY
      - name: Commit Cliente
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-CLIENTE-v6.html
          git diff --cached --quiet && exit 0
          git commit -m "Publish client rewards feedback justifications and offline support"
          git push
