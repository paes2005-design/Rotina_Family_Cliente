name: Rotina Family Cliente regression audit
on:
  push:
    paths:
      - '.github/workflows/client-regression-audit.yml'
      - '*.js'
      - '*.mjs'
      - '*.css'
      - '*.html'
      - 'manifest.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and JSON
        run: |
          node --check client-ui-pro.js
          node --check client-time-guard-v2.js
          node --check client-reviewed-points.js
          node --check client-early-start-ui.js
          node --check client-tolerance-timer.js
          node --check tolerance-timer-core.js
          node --check timer-simulation.mjs
          node --check scoring-core.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest OK')"
      - name: Full Client regression audit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import {pathToFileURL} from 'url';
          const read=f=>fs.readFileSync(f,'utf8');
          const html=read('index-CLIENTE-v6.html'),ui=read('client-ui-pro.js'),guard=read('client-time-guard-v2.js'),review=read('client-reviewed-points.js'),early=read('client-early-start-ui.js'),timer=read('client-tolerance-timer.js'),timerCoreSrc=read('tolerance-timer-core.js'),sw=read('sw.js'),manifest=JSON.parse(read('manifest.json'));
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg);console.log('OK - '+msg)};

          // Stability / loading
          assert(!guard.includes('setInterval('),'temporal guard has no continuous interval');
          assert(!review.includes('setInterval('),'reviewed-points module has no continuous interval');
          assert(!early.includes('setInterval('),'early-start Client display has no continuous interval');
          assert((timer.match(/setInterval\(/g)||[]).length===1,'timer has exactly one global interval');
          assert(!guard.includes('MutationObserver'),'temporal guard has no mutation observer');
          assert(!review.includes('MutationObserver'),'reviewed-points module has no mutation observer');
          assert(!early.includes('MutationObserver'),'early-start Client display reuses the existing row observer');
          assert(!timer.includes('MutationObserver'),'timer adds no mutation observer');
          assert(ui.includes("subtree:false"),'existing task observer is restricted to direct row changes');
          assert(ui.includes("import('./client-time-guard-v2.js')"),'new temporal guard is loaded');
          assert(ui.includes("import('./client-reviewed-points.js')"),'reviewed points module is loaded');
          assert(ui.includes("import('./client-early-start-ui.js')"),'early-start blue status module is loaded');
          assert(ui.includes("import('./client-tolerance-timer.js')"),'tolerance timer production module is loaded');
          assert(ui.includes('prepararCronometrosTolerancia'),'existing row decorator prepares timer nodes');
          assert(!ui.includes("client-rules-v2.js")&&!ui.includes("client-compat-v2.js"),'known freezing modules stay disabled');
          assert(!sw.includes("client-rules-v2.js")&&!sw.includes("client-compat-v2.js"),'known freezing modules stay outside app shell');
          assert(sw.includes("cache:'no-store'"),'HTML/JS/CSS refresh network-first');
          assert(ui.includes('__rotinaTimeGuardReady=false'),'legacy scoring is blocked during startup');
          assert(ui.includes("addEventListener('rotina-time-guard-ready'"),'Client listens for guard readiness');
          assert(guard.includes("dispatchEvent(new CustomEvent('rotina-time-guard-ready'))"),'guard releases startup block only after installation');

          // Timer anti-freeze / read-only invariants
          const updateBody=timer.match(/export function atualizarSomenteTextoCronometro[\s\S]*?\nfunction garantirEscuta/)?.[0]||'';
          const tickBody=timer.match(/function tick\(\)\{([\s\S]*?)\n\}/)?.[1]||'';
          assert(updateBody.length>0,'timer text-only update function found');
          assert(!/(createElement|appendChild|insertAdjacent|innerHTML|\.remove\()/.test(updateBody),'1-second update never creates/removes DOM');
          assert(updateBody.includes('textContent')&&updateBody.includes('hidden'),'1-second update only refreshes existing timer presentation');
          assert(tickBody&&!tickBody.includes('prepararLinhasCronometro'),'1-second tick never prepares/rebuilds timer DOM');
          assert(timer.includes('function iniciarTimerUnico()')&&timer.includes('if(timerId!==null)return'),'global timer cannot be started twice');
          assert(timer.includes("addEventListener('visibilitychange'"),'timer recalculates immediately when app returns from background');
          assert(!/(authNome|authPin|telaAuth)/.test(timer),'timer never touches login fields');
          assert(!/(updateDoc|setDoc|addDoc|deleteDoc|writeBatch|runTransaction)\s*\(/.test(timer),'timer module is Firestore read-only');
          assert(timer.includes('onSnapshot(')&&timer.includes("where('grupoId','==',s.grupo)"),'timer uses one scoped Firestore listener for active group');
          assert(timerCoreSrc.includes("from './scoring-core.js'"),'timer classification reuses scoring-core');
          assert(timerCoreSrc.includes('inicioExecutadoEm')&&timerCoreSrc.includes('terminoExecutadoEm'),'timer uses persisted absolute timestamps');
          assert(sw.includes('client-tolerance-timer.js')&&sw.includes('tolerance-timer-core.js'),'timer production modules are cached for offline fallback');
          assert(sw.includes("const CACHE_NAME='rotina-family-cliente-v23'"),'production cache is v23');

          // Shared tolerance scoring core
          const core=await import(pathToFileURL(process.cwd()+'/scoring-core.js').href+'?audit='+Date.now());
          const pct=(tol,cons)=>core.classificarConsumoTolerancia(tol,cons).percentual;
          assert(pct(2,0)===100&&pct(2,2)===100,'legacy minute compatibility remains available');
          assert(core.classificarConsumoToleranciaSegundos(10,599).percentual===100,'exact rule: 10 min minus 1 second remains 100%');
          assert(core.classificarConsumoToleranciaSegundos(10,600).percentual===75,'exact rule: zero enters 75% immediately');
          assert(core.classificarConsumoToleranciaSegundos(10,675).percentual===50,'exact rule: +12.5% enters 50%');
          assert(core.classificarConsumoToleranciaSegundos(10,750).percentual===0,'exact rule: +25% total enters 0%');
          const calc=core.calcularConsumoAtraso({inicioPrevisto:new Date('2026-08-08T02:55:00'),inicioReal:new Date('2026-08-08T02:56:59'),fimPrevisto:new Date('2026-08-08T03:00:00'),fimReal:new Date('2026-08-08T03:02:59')});
          assert(calc.atrasoInicio===1&&calc.atrasoFim===2&&calc.consumoTotal===3,'historical minute fields remain compatible');
          assert(calc.consumoTotalSeg===238,'exact seconds are persisted for the new scoring rule');
          const midnight=core.calcularConsumoAtraso({inicioPrevisto:new Date('2026-08-07T21:35:00'),inicioReal:new Date('2026-08-08T00:49:00'),fimPrevisto:new Date('2026-08-07T21:36:00'),fimReal:new Date('2026-08-08T00:49:00')});
          assert(midnight.atrasoInicio===194&&midnight.atrasoFim===193&&midnight.consumoTotal===387,'midnight crossing uses full dates, not HH:mm only');

          // Guard writes and justification
          assert(guard.includes('inicioExecutadoEm'),'start timestamp is persisted');
          assert(guard.includes('terminoExecutadoEm'),'finish timestamp is persisted');
          assert(guard.includes('dataExecucao'),'execution date is persisted');
          assert(guard.includes('toleranciaConsumidaMin'),'shared consumed tolerance is persisted');
          assert(guard.includes('toleranciaConsumidaSeg'),'exact consumed tolerance is persisted');
          assert(guard.includes('atrasoInicioMin')&&guard.includes('atrasoFimMin'),'start and finish delays are individually audited');
          assert(guard.includes("const obrigatoria=t.justificativaObrigatoria!==false"),'mandatory justification defaults safely to true');
          assert(guard.includes("const botaoSem=obrigatoria?'':"),'mandatory justification has no skip button');
          assert(guard.includes('SpeechRecognition')&&guard.includes("lang='pt-BR'"),'voice dictation is restored in pt-BR');
          assert(guard.includes("palavras.length<5"),'justification minimum length is validated');
          assert(guard.includes("Enviando..."),'send button has progress state');
          assert(guard.includes('Não foi possível enviar a justificativa'),'send failure is recoverable and explained');
          assert(guard.includes("revisaoStatus:temJustificativa?'aguardando':'sem-revisao'"),'submitted justification awaits adult review');
          assert(guard.includes('pontosOriginais:pontos')&&guard.includes('percentualOriginal:faixa.percentual'),'automatic result is preserved for later review');

          // Daily panels: visual reset only, historical balance preserved
          assert(html.includes('Meus resgates de hoje'),'rewards panel is explicitly daily');
          assert(html.includes("formatarDataISO(d)===hojeISO"),'reward history is filtered using local current date');
          assert(html.includes("h.justificativaAtraso&&h.data===hojeISO"),'justifications are filtered to current day');
          assert(html.includes("r.status==='Aprovado'||r.status==='Pendente'"),'historical approved/pending redemptions still affect available balance');
          assert(html.includes("cacheHistorico.reduce((s,h)=>s+(Number(h.pontosGanhos)||0),0)"),'points balance remains historical and cumulative');

          // Early start: educational marker, exact date, no scoring side effects
          for(const campo of ['inicioAntecipado','antecipacaoMin','motivoInicioAntecipado','tipoMotivoInicioAntecipado']) assert(guard.includes(campo),`early-start guard persists ${campo}`);
          assert(early.includes("badge.textContent='🔵 Início antecipado'"),'Client shows blue early-start status');
          assert(early.includes("t?.inicioAntecipado===true&&t?.dataExecucao===hoje"),'Client blue status is limited to the current occurrence date');
          assert(early.includes("where('grupoId','==',s.grupo)"),'Client early display reads only the active group');
          assert(!early.includes('updateDoc(')&&!early.includes('setDoc(')&&!early.includes('writeBatch('),'Client early display never writes points/data');
          assert(ui.includes('aplicarInicioAntecipadoCliente'),'existing row decorator reapplies early-start status');
          assert(sw.includes('client-early-start-ui.js'),'Client PWA still caches early-start module');

          // Reviewed points consistency
          assert(review.includes('pontosDevolvidos'),'Client can display returned points');
          assert(review.includes('somarPeriodo'),'reviewed effective points recalculate day/week/month');
          assert(review.includes('pontuação automática mantida'),'maintained review message exists');
          assert(review.includes('ponto${devolvidos===1'),'returned-points message exists');
          assert(ui.includes('aplicarPontosRevisadosCliente'),'review display is reapplied after task rows rerender');

          // Current client UI / session / PWA
          for(const s of ['conectarCliente','sairCliente','renderizarTarefasHoje','resgatarRecompensa']) assert(html.includes(s),`core flow ${s} remains present`);
          assert(html.includes("localStorage.getItem('cliente_nome')"),'saved Client session restoration remains present');
          assert(sw.includes('client-reviewed-points.js')&&sw.includes('client-time-guard-v2.js')&&sw.includes('scoring-core.js'),'active modules are cached for fallback');
          assert(manifest.start_url,'manifest has start URL');

          // Known consistency checks that must never regress
          assert(html.includes("`${h.data}__${h.tarefaId}`"),'editing a justification updates the canonical execution document');
          console.log('ALL CLIENT + TIMER PRODUCTION REGRESSION CHECKS PASSED');
          NODE
      - name: Deterministic timer simulation and stress
        run: node timer-simulation.mjs
