name: Client manual icons branch test
on:
  push:
    branches:
      - test/manual-icons
    paths:
      - .github/workflows/manual-icons-branch-test.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/manual-icons
      - name: Syntax and Client regression
        run: |
          node --check client-ui-pro.js
          node --check client-time-guard-v2.js
          node --check client-reviewed-points.js
          node --check scoring-core.js
          node --check sw.js
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import {pathToFileURL} from 'url';
          const html=fs.readFileSync('index-CLIENTE-v6.html','utf8');
          const ui=fs.readFileSync('client-ui-pro.js','utf8');
          const guard=fs.readFileSync('client-time-guard-v2.js','utf8');
          const review=fs.readFileSync('client-reviewed-points.js','utf8');
          const assert=(v,m)=>{if(!v)throw new Error(m);console.log('OK - '+m)};
          assert(html.includes('data-task-icon="${escaparHtml(dados.icone||\'\')}"'),'task row exposes persisted icon to UI');
          assert(ui.includes("(strong.dataset.taskIcon||'').trim()||iconeTarefa"),'persisted icon wins before legacy name fallback');
          assert(guard.includes("icone:t.icone||''"),'history preserves explicit task icon');
          assert(!guard.includes('setInterval(')&&!review.includes('setInterval('),'no continuous timers were introduced');
          assert(!guard.includes('MutationObserver')&&!review.includes('MutationObserver'),'scoring/review modules remain observer-free');
          assert(!ui.includes('client-rules-v2.js')&&!ui.includes('client-compat-v2.js'),'known freezing modules remain disabled');
          assert(ui.includes("import('./client-time-guard-v2.js')"),'active scoring guard remains loaded');
          assert(ui.includes("import('./client-reviewed-points.js')"),'reviewed points module remains loaded');
          const core=await import(pathToFileURL(process.cwd()+'/scoring-core.js').href+'?t='+Date.now());
          const pct=(tol,cons)=>core.classificarConsumoTolerancia(tol,cons).percentual;
          assert(pct(2,2)===100&&pct(2,3)===75&&pct(2,4)===50&&pct(2,5)===0,'2-minute tolerance boundaries remain 100/75/50/0');
          assert(pct(10,10)===100&&pct(10,13)===75&&pct(10,15)===50&&pct(10,16)===0,'10-minute tolerance boundaries remain 100/75/50/0');
          assert(guard.includes("const obrigatoria=t.justificativaObrigatoria!==false"),'mandatory justification behavior remains');
          assert(guard.includes('SpeechRecognition')&&guard.includes("lang='pt-BR'"),'voice justification remains');
          assert(review.includes('pontosDevolvidos')&&review.includes('somarPeriodo'),'returned points display and totals remain');
          for(const f of ['conectarCliente','sairCliente','renderizarTarefasHoje','resgatarRecompensa']) assert(html.includes(f),`core flow ${f} remains`);
          console.log('ALL CLIENT MANUAL ICON BRANCH TESTS PASSED');
          NODE
