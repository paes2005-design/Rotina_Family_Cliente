name: Sprint 2.1 participant task observation icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-participant-task-observation-icon.yml'
      - 'scripts/add-participant-task-observation-icon.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply participant observation UI
        run: python scripts/add-participant-task-observation-icon.py

      - name: Audit participant observation UI
        shell: bash
        run: |
          set -euo pipefail
          node --check client-bootstrap-v1.js
          node --check runtime-build-info.js
          node --check sw.js
          grep -q 'id="modalObservacaoTarefa"' index-CLIENTE-v6.html
          grep -q 'window.abrirObservacaoTarefa = id =>' index-CLIENTE-v6.html
          grep -q 'const botaoObservacao=observacao?' index-CLIENTE-v6.html
          grep -q 'btn-observacao-tarefa' client-ui-pro.css
          grep -q "const BUILD='20260913.2'" client-bootstrap-v1.js
          grep -q "runtime-build-info.js?v=20260913.2" client-bootstrap-v1.js
          grep -q "expectedServiceWorkerVersion:'85'" runtime-build-info.js
          grep -q "ROTINA_SW_VERSION='85'" sw.js
          grep -q "ROTINA_BUILD_ID='20260913.2'" sw.js
          grep -q "const BUILD='20260913.2'" index.html
          grep -q "release:'sprint2.1-participant-observation-icon-v1'" index.html
          ! grep -q 'getDocFromServer' index-CLIENTE-v6.html
          echo 'PARTICIPANT_OBSERVATION_ICON_AUDIT=OK'

      - name: Commit production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-CLIENTE-v6.html client-ui-pro.css index.html sw.js runtime-build-info.js client-bootstrap-v1.js
          if git diff --cached --quiet; then
            echo 'Participant observation UI already applied.'
            exit 0
          fi
          git commit -m 'Sprint 2.1: participant can open task observation'
          git push origin HEAD:main
