name: Rotina Family Client alarm audit
on:
  push:
    paths:
      - 'family-alarm-client.js'
      - 'client-ui-pro.js'
      - 'sw.js'
      - '.github/workflows/family-alarm-audit.yml'
jobs:
  alarm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check family-alarm-client.js
          node --check client-ui-pro.js
          node --check sw.js
      - name: Alarm offline and authority regression
        run: |
          node <<'NODE'
          const fs=require('fs');
          const alarm=fs.readFileSync('family-alarm-client.js','utf8');
          const ui=fs.readFileSync('client-ui-pro.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const ok=(v,m)=>{if(!v)throw new Error(m);console.log('OK - '+m)};
          ok(ui.includes("import('./family-alarm-client.js?v=1')"),'Client loads family alarm');
          ok(sw.includes("'./family-alarm-client.js'"),'alarm module is cached offline');
          ok(alarm.includes("rotina_family_alarm_pref_v1")&&alarm.includes("rotina_family_alarm_state_v1"),'tone and alarm state persist locally');
          ok(alarm.includes("rotina_family_alarm_pending_v1"),'offline command queue persists locally');
          ok(alarm.includes("state.origem==='ADM'||state.bloqueado===true"),'ADM alarm is visibly locked on Client');
          ok(alarm.includes("if(state.origem==='ADM'||state.bloqueado)return"),'Client cannot stop ADM-origin alarm');
          ok(alarm.includes("if(!navigator.onLine){salvar(KEY_PENDING,payload);return;}"),'Client queues writes offline');
          ok(alarm.includes("window.addEventListener('online',sincronizarPendente)"),'offline queue syncs on reconnection');
          ok(alarm.includes("onSnapshot(doc(getFirestore(getApp()),'despertadores'"),'remote ADM alarm is listened in real time');
          ok(alarm.includes('AudioContext||window.webkitAudioContext'),'tones are generated by Web Audio');
          ok(!/\.(mp3|wav|ogg|m4a)/i.test(alarm),'alarm does not depend on installed/external music files');
          for(const t of ['classico','digital','campainha','suave','musica'])ok(alarm.includes(t),'built-in tone '+t+' exists');
          ok(alarm.includes("localStorage.getItem('cliente_grupo')")&&alarm.includes("localStorage.getItem('cliente_perfil_id')"),'alarm binds to authenticated Client profile');
          console.log('ALL CLIENT FAMILY ALARM CHECKS PASSED');
          NODE
