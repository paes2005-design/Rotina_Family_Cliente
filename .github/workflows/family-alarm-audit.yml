name: Rotina Family Client alarm audit
on:
  push:
    paths:
      - 'family-alarm-client.js'
      - 'client-ui-pro.js'
      - 'index-CLIENTE-v6.html'
      - 'sw.js'
      - '.github/workflows/family-alarm-audit.yml'
jobs:
  alarm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check family-alarm-client.js
          node --check client-ui-pro.js
          node --check sw.js
      - name: Alarm offline and authority regression
        run: |
          node <<'NODE'
          const fs=require('fs');
          const alarm=fs.readFileSync('family-alarm-client.js','utf8');
          const ui=fs.readFileSync('client-ui-pro.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const index=fs.readFileSync('index-CLIENTE-v6.html','utf8');
          const ok=(v,m)=>{if(!v)throw new Error(m);console.log('OK - '+m)};
          ok(ui.includes("import('./family-alarm-client.js?v=2')"),'Client loads task alarm v2');
          ok(sw.includes("'./family-alarm-client.js'"),'alarm module is cached offline');
          ok(index.includes('data-family-task-id'),'every rendered Client task exposes its identity');
          ok(alarm.includes('family-task-alarm-client'),'alarm control is attached to each task');
          ok(alarm.includes('rotina_family_alarm_pref_v2')&&alarm.includes('rotina_family_task_alarms_v2'),'tones and per-task alarms persist locally');
          ok(alarm.includes('rotina_family_task_alarm_pending_v2'),'offline command queue persists locally');
          ok(alarm.includes("a.origem==='ADM'||a.bloqueado===true"),'ADM task alarm is visibly locked on Client');
          ok(alarm.includes("origem==='CLIENTE'&&travado(atual)"),'Client cannot remove ADM-origin task alarm');
          ok(alarm.includes("if(!navigator.onLine||!getApps().length){enfileirar(payload)"),'Client queues writes offline');
          ok(alarm.includes("window.addEventListener('online',sincronizarPendente)"),'offline queue syncs on reconnection');
          ok(alarm.includes("where('grupoId','==',g)"),'remote task alarms are listened in real time');
          ok(alarm.includes('nomeTarefa')&&alarm.includes('HORA DA TAREFA'),'ringing alert identifies the task');
          ok(alarm.includes('horaSugeridaInicio')&&alarm.includes('diaSemana'),'alarm is scheduled by task day and start time');
          ok(!alarm.includes('familyAlarmClientBtn'),'disconnected global alarm button was removed');
          ok(alarm.includes('AudioContext||window.webkitAudioContext'),'tones are generated by Web Audio');
          ok(!/\.(mp3|wav|ogg|m4a)/i.test(alarm),'alarm does not depend on installed/external music files');
          for(const t of ['classico','digital','campainha','suave','musica'])ok(alarm.includes(t),'built-in tone '+t+' exists');
          ok(alarm.includes("localStorage.getItem('cliente_grupo')")&&alarm.includes("localStorage.getItem('cliente_perfil_id')"),'alarm binds to authenticated Client profile');
          console.log('ALL CLIENT FAMILY ALARM CHECKS PASSED');
          NODE
