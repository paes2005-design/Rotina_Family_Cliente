name: Rotina Family Client alarm audit
on:
  push:
    paths:
      - 'family-alarm-client.js'
      - 'alarm-schedule-core.js'
      - 'client-week-nav.js'
      - 'client-ui-pro.js'
      - 'index-CLIENTE-v6.html'
      - 'sw.js'
      - '.github/workflows/family-alarm-audit.yml'
jobs:
  alarm-audit:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bahia
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check family-alarm-client.js
          node --check alarm-schedule-core.js
          node --check client-week-nav.js
          node --check client-ui-pro.js
          node --check sw.js
      - name: Alarm data, offline and authority regression
        run: |
          node <<'NODE'
          const fs=require('fs');
          const alarm=fs.readFileSync('family-alarm-client.js','utf8');
          const core=fs.readFileSync('alarm-schedule-core.js','utf8');
          const week=fs.readFileSync('client-week-nav.js','utf8');
          const ui=fs.readFileSync('client-ui-pro.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const index=fs.readFileSync('index-CLIENTE-v6.html','utf8');
          const ok=(v,m)=>{if(!v)throw new Error(m);console.log('OK - '+m)};
          ok(ui.includes("import('./family-alarm-client.js?v=8')"),'Client loads stoppable date alarm v8');
          ok(ui.includes("import('./client-week-nav.js?v=3')"),'Client loads weekly navigation with dated rows');
          ok(sw.includes("'./family-alarm-client.js'")&&sw.includes("'./alarm-schedule-core.js'"),'date alarm remains cached offline');
          ok(index.includes('data-family-task-date'),'today task exposes its exact date');
          ok(week.includes('data-family-task-date')&&week.includes('data-family-task-id'),'all weekly consultation rows expose date and task identity');
          ok(alarm.includes('family-task-alarm-client'),'alarm control is attached to each dated task');
          ok(alarm.includes('rotina_family_task_alarms_v3')&&alarm.includes('rotina_family_task_alarm_pending_v3'),'dated state and offline queue use the v3 schema');
          ok(alarm.includes('rotina_family_task_alarm_week_v1')&&alarm.includes('zerarViradaSemana'),'week rollover is tracked and reset');
          ok(alarm.includes("expiradoPor:'VIRADA_SEMANA'")&&alarm.includes('expirarAlarmesRemotos'),'old remote alarm documents are explicitly deactivated');
          ok(alarm.includes('filter(p=>naSemanaAtual(p))'),'old-week offline commands are discarded');
          ok(alarm.includes("a.origem==='ADM'||a.bloqueado===true"),'ADM task alarm remains locked on Client');
          ok(alarm.includes("origem==='CLIENTE'&&travado(atual)"),'Client cannot remove ADM-origin alarm');
          ok(alarm.includes("if(!navigator.onLine||!getApps().length){enfileirar(payload)"),'Client still queues writes offline');
          ok(alarm.includes("window.addEventListener('online',()=>{sincronizarPendente();expirarAlarmesRemotos()})"),'offline queue and expiration sync on reconnection');
          ok(alarm.includes("where('grupoId','==',g)"),'remote alarms remain group-scoped and real-time');
          ok(alarm.includes('dataAgendada')&&alarm.includes('semanaInicio')&&core.includes('inicioEm')&&core.includes('fimEm'),'alarm payload stores exact date and start/end datetimes');
          ok(alarm.includes('versaoAgenda:3'),'alarm payload identifies dated schema');
          ok(alarm.includes('JANELA_DISPARO_MS=5*60*1000'),'foreground timer tolerates short mobile throttling');
          ok(alarm.includes('LIMITE_TOQUE_MS=2*60*1000')&&alarm.includes('autoStopTimer=setTimeout'),'ringing always stops automatically');
          ok(alarm.includes("actions:[{action:'stop-alarm'")&&sw.includes("event.action==='stop-alarm'"),'notification exposes a working Stop action');
          ok(sw.includes("addEventListener('notificationclose'")&&sw.includes('ROTINA_FAMILY_ALARM_STOP'),'dismissing the notification stops the page alarm');
          ok(alarm.includes('const proximos={}')&&alarm.includes("origem:s.metadata.fromCache?'cache':'servidor'"),'remote snapshot replaces stale device state');
          ok(index.includes('OneSignal.User.PushSubscription.optIn()')&&index.includes('OneSignal.login(`rotina_family__'),'OneSignal subscription is enabled and linked to the Client profile');
          ok(index.includes('oneSignalBasePath')&&index.includes('push/onesignal/OneSignalSDKWorker.js'),'OneSignal worker uses the deployed GitHub Pages base path');
          ok(alarm.includes('showNotification')&&alarm.includes('nomeTarefa'),'system notification identifies the task');
          ok(sw.includes("addEventListener('notificationclick'"),'notification opens or focuses Client');
          ok(!alarm.includes('familyAlarmClientBtn'),'disconnected global alarm button stays removed');
          ok(alarm.includes('AudioContext||window.webkitAudioContext'),'tones remain generated by Web Audio');
          ok(!/\.(mp3|wav|ogg|m4a)/i.test(alarm),'alarm does not depend on external music files');
          ok(core.includes("['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado']"),'one canonical short weekday contract is used');
          console.log('ALL CLIENT DATE ALARM CHECKS PASSED');
          NODE
      - name: Seven-day, exact-date and week-rollover regression
        run: |
          node --input-type=module <<'NODE'
          import {agendaDaTarefa,alarmeVigente,chaveOcorrencia,dataDaSemana,deveDispararAgora,momentoDaOcorrenciaAtual,proximaOcorrencia,semanaInicioISO} from './alarm-schedule-core.js';
          const ok=(v,m)=>{if(!v)throw new Error(m);console.log('OK - '+m)};
          const dias=[
            ['Segunda','2026-08-17'],['Terça','2026-08-18'],['Quarta','2026-08-19'],
            ['Quinta','2026-08-20'],['Sexta','2026-08-21'],['Sábado','2026-08-22'],['Domingo','2026-08-23']
          ];
          const referencia=new Date('2026-08-20T12:00:00');
          ok(semanaInicioISO(referencia)==='2026-08-17','week starts on Monday');
          for(const [dia,data] of dias){
            ok(dataDaSemana(dia,referencia)===data,dia+' maps to '+data);
            const agenda=agendaDaTarefa({diaSemana:dia,horaSugeridaInicio:'07:00',horaSugeridaFim:'07:30'},referencia);
            ok(agenda.dataAgendada===data&&agenda.semanaInicio==='2026-08-17',dia+' receives exact current-week date');
            const alarme={ativo:true,tarefaId:'task-'+dia,diaSemana:dia,horaSugeridaInicio:'07:00',horaSugeridaFim:'07:30',momentos:['inicio'],acionadoEm:'2026-08-16T12:00:00-03:00',...agenda};
            ok(alarmeVigente(alarme,new Date(data+'T07:00:20')),dia+' alarm is current in its week');
            ok(deveDispararAgora(alarme,new Date(data+'T07:00:20')),dia+' rings on its exact date');
            const outra=new Date(data+'T07:00:20');outra.setDate(outra.getDate()===17?18:17);
            ok(!deveDispararAgora(alarme,outra),dia+' does not ring on a different date');
          }
          ok(dataDaSemana('Segunda-feira',referencia)==='2026-08-17','legacy display label is normalized without changing stored contract');
          const baseAgenda=agendaDaTarefa({diaSemana:'Quinta',horaSugeridaInicio:'03:26',horaSugeridaFim:'04:10'},referencia);
          const base={ativo:true,tarefaId:'pedala',diaSemana:'Quinta',horaSugeridaInicio:'03:26',horaSugeridaFim:'04:10',momentos:['inicio'],acionadoEm:'2026-08-19T20:00:00-03:00',...baseAgenda};
          ok(deveDispararAgora(base,new Date('2026-08-20T03:30:59')),'alarm catches up after 4m59s of mobile throttling');
          ok(!deveDispararAgora(base,new Date('2026-08-20T03:31:00')),'alarm does not ring after the five-minute safety window');
          ok(!deveDispararAgora({...base,acionadoEm:'2026-08-20T03:26:40-03:00'},new Date('2026-08-20T03:26:45')),'alarm activated after its instant does not ring retroactively');
          const ocorrencia=chaveOcorrencia(base,new Date('2026-08-20T03:30:00'));
          ok(ocorrencia==='pedala__inicio__2026-08-20__03:26','catch-up occurrence receives a stable dated key');
          ok(!deveDispararAgora(base,new Date('2026-08-20T03:30:00'),300000,ocorrencia),'stopped dated occurrence does not ring again');
          ok(!deveDispararAgora(base,new Date('2026-08-27T03:26:20')),'date alarm never repeats automatically next week');
          ok(proximaOcorrencia(base,new Date('2026-08-20T09:00:00'))===null,'past date has no automatic next-week occurrence');
          const ambos={...base,momentos:['inicio','fim']};
          ok(deveDispararAgora(ambos,new Date('2026-08-20T04:10:20')),'finish alarm rings on the same exact date');
          ok(momentoDaOcorrenciaAtual(ambos,new Date('2026-08-20T04:10:20'))==='fim','finish occurrence is identified');
          const madrugadaAgenda=agendaDaTarefa({diaSemana:'Quinta',horaSugeridaInicio:'23:50',horaSugeridaFim:'00:10'},referencia);
          const madrugada={ativo:true,tarefaId:'madrugada',diaSemana:'Quinta',horaSugeridaInicio:'23:50',horaSugeridaFim:'00:10',momentos:['fim'],acionadoEm:'2026-08-20T18:00:00-03:00',...madrugadaAgenda};
          ok(madrugadaAgenda.fimEm==='2026-08-21T00:10:00','finish after midnight advances one calendar date');
          ok(deveDispararAgora(madrugada,new Date('2026-08-21T00:10:20')),'cross-midnight finish rings inside the same week');
          const domingoAgenda=agendaDaTarefa({diaSemana:'Domingo',horaSugeridaInicio:'23:50',horaSugeridaFim:'00:10'},referencia);
          const domingo={ativo:true,tarefaId:'domingo',diaSemana:'Domingo',horaSugeridaInicio:'23:50',horaSugeridaFim:'00:10',momentos:['fim'],acionadoEm:'2026-08-23T18:00:00-03:00',...domingoAgenda};
          ok(!deveDispararAgora(domingo,new Date('2026-08-24T00:10:20')),'Sunday alarm is zeroed at Monday week rollover');
          ok(!alarmeVigente(base,new Date('2026-08-24T00:00:01')),'previous-week alarm is inactive immediately after rollover');
          const novaSemana=agendaDaTarefa({diaSemana:'Quinta',horaSugeridaInicio:'03:26',horaSugeridaFim:'04:10'},new Date('2026-08-24T12:00:00'));
          ok(novaSemana.dataAgendada==='2026-08-27'&&novaSemana.semanaInicio==='2026-08-24','new week creates a fresh dated occurrence');
          ok(dataDaSemana('Domingo',new Date('2026-12-31T12:00:00'))==='2027-01-03','week date mapping crosses the year boundary safely');
          const anoNovo=agendaDaTarefa({diaSemana:'Segunda',horaSugeridaInicio:'07:00',horaSugeridaFim:'07:30'},new Date('2027-01-04T12:00:00'));
          ok(anoNovo.dataAgendada==='2027-01-04'&&anoNovo.semanaInicio==='2027-01-04','first Monday of a new year starts a clean week');
          console.log('ALL SEVEN-DAY AND WEEK-ROLLOVER CHECKS PASSED');
          NODE
