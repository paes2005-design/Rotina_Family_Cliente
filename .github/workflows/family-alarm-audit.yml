name: Rotina Family Client alarm audit
on:
  push:
    paths:
      - 'family-alarm-client.js'
      - 'alarm-schedule-core.js'
      - 'client-ui-pro.js'
      - 'index-CLIENTE-v6.html'
      - 'sw.js'
      - '.github/workflows/family-alarm-audit.yml'
jobs:
  alarm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check family-alarm-client.js
          node --check alarm-schedule-core.js
          node --check client-ui-pro.js
          node --check sw.js
      - name: Alarm offline and authority regression
        run: |
          node <<'NODE'
          const fs=require('fs');
          const alarm=fs.readFileSync('family-alarm-client.js','utf8');
          const ui=fs.readFileSync('client-ui-pro.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const index=fs.readFileSync('index-CLIENTE-v6.html','utf8');
          const ok=(v,m)=>{if(!v)throw new Error(m);console.log('OK - '+m)};
          ok(ui.includes("import('./family-alarm-client.js?v=4')"),'Client loads scheduled task alarm v4');
          ok(sw.includes("'./family-alarm-client.js'"),'alarm module is cached offline');
          ok(index.includes('data-family-task-id'),'every rendered Client task exposes its identity');
          ok(alarm.includes('family-task-alarm-client'),'alarm control is attached to each task');
          ok(alarm.includes('rotina_family_alarm_pref_v2')&&alarm.includes('rotina_family_task_alarms_v2'),'tones and per-task alarms persist locally');
          ok(alarm.includes('rotina_family_task_alarm_pending_v2'),'offline command queue persists locally');
          ok(alarm.includes("a.origem==='ADM'||a.bloqueado===true"),'ADM task alarm is visibly locked on Client');
          ok(alarm.includes("origem==='CLIENTE'&&travado(atual)"),'Client cannot remove ADM-origin task alarm');
          ok(alarm.includes("if(!navigator.onLine||!getApps().length){enfileirar(payload)"),'Client queues writes offline');
          ok(alarm.includes("window.addEventListener('online',sincronizarPendente)"),'offline queue syncs on reconnection');
          ok(alarm.includes("where('grupoId','==',g)"),'remote task alarms are listened in real time');
          ok(alarm.includes('nomeTarefa')&&alarm.includes('HORA DA TAREFA'),'ringing alert identifies the task');
          ok(alarm.includes('deveDispararAgora'),'alarm delegates firing to strict schedule');
          ok(alarm.includes('m.remove();toast(ativar')&&alarm.includes('gravar(tarefa,ativar'),'programming panel closes before remote synchronization');
          ok(alarm.includes('silenciarOcorrencia(a)')&&!alarm.includes("gravar(a,false,'CLIENTE')"),'ringing Stop silences occurrence without removing alarm');
          ok(alarm.includes('showNotification')&&alarm.includes('nomeTarefa'),'system notification identifies ringing task');
          ok(sw.includes("addEventListener('notificationclick'"),'notification opens or focuses Client app');
          ok(sw.includes("'./alarm-schedule-core.js'"),'schedule core is cached offline');
          ok(!alarm.includes('familyAlarmClientBtn'),'disconnected global alarm button was removed');
          ok(alarm.includes('AudioContext||window.webkitAudioContext'),'tones are generated by Web Audio');
          ok(!/\.(mp3|wav|ogg|m4a)/i.test(alarm),'alarm does not depend on installed/external music files');
          for(const t of ['classico','digital','campainha','suave','musica'])ok(alarm.includes(t),'built-in tone '+t+' exists');
          ok(alarm.includes("localStorage.getItem('cliente_grupo')")&&alarm.includes("localStorage.getItem('cliente_perfil_id')"),'alarm binds to authenticated Client profile');
          console.log('ALL CLIENT FAMILY ALARM CHECKS PASSED');
          NODE
      - name: Scheduled firing regression
        run: |
          node --input-type=module <<'NODE'
          import {deveDispararAgora,proximaOcorrencia} from './alarm-schedule-core.js';
          const ok=(v,m)=>{if(!v)throw new Error(m);console.log('OK - '+m)};
          const base={ativo:true,tarefaId:'pedala',diaSemana:'Sábado',horaSugeridaInicio:'03:26',acionadoEm:'2026-08-15T02:00:00'};
          ok(!deveDispararAgora(base,new Date('2026-08-15T09:21:27')),'03:26 does not ring late at 09:21');
          ok(deveDispararAgora(base,new Date('2026-08-15T03:26:30')),'alarm rings inside its scheduled minute');
          ok(!deveDispararAgora({...base,acionadoEm:'2026-08-15T03:26:40'},new Date('2026-08-15T03:26:45')),'alarm enabled after scheduled instant waits for next occurrence');
          const occurrence='pedala__2026-08-15__03:26';
          ok(!deveDispararAgora(base,new Date('2026-08-15T03:26:30'),60000,occurrence),'stopped occurrence does not ring again in the same minute');
          ok(deveDispararAgora(base,new Date('2026-08-22T03:26:30'),60000,occurrence),'stopping today keeps next scheduled occurrence active');
          const next=proximaOcorrencia(base,new Date('2026-08-15T09:21:27'));
          ok(next?.getFullYear()===2026&&next?.getMonth()===7&&next?.getDate()===22&&next?.getHours()===3&&next?.getMinutes()===26,'past Saturday task schedules next Saturday at 03:26');
          console.log('ALL SCHEDULED ALARM CHECKS PASSED');
          NODE
