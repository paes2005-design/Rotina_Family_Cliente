name: Identify rules service account and clean temporary routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-identify-rules-service-account-and-clean.yml'

permissions:
  contents: write

jobs:
  identify-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add service account identity to one-time failure response
        shell: python
        run: |
          from pathlib import Path
          p=Path('onesignal-scheduler/src/master-rate-limit-production-entry.js')
          s=p.read_text(encoding='utf-8')
          old="return Response.json({ ok:false, error:String(error?.message || error).replace(/\\s+/g,' ').slice(0,500) }, { headers: { 'cache-control': 'no-store' } });"
          new="let serviceAccountEmail=''; try { serviceAccountEmail=String(JSON.parse(env.GOOGLE_SERVICE_ACCOUNT_JSON||'{}').client_email||''); } catch (_) {} return Response.json({ ok:false, error:String(error?.message || error).replace(/\\s+/g,' ').slice(0,500), serviceAccountEmail }, { headers: { 'cache-control': 'no-store' } });"
          if old not in s and 'serviceAccountEmail' not in s:
              raise SystemExit('Rules route failure marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Validate and deploy identity response
        working-directory: onesignal-scheduler
        run: |
          npm ci
          node --check src/master-rate-limit-production-entry.js
          npm test
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Identify service account without exposing key
        shell: bash
        run: |
          BODY="$(curl --silent --show-error -X POST 'https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/security/deploy-firestore-rules-v1')"
          echo "RULES_SERVICE_ACCOUNT_RESULT=$BODY"
          python3 - "$BODY" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          email=d.get('serviceAccountEmail','')
          assert email and '@' in email, d
          print('RULES_SERVICE_ACCOUNT_EMAIL='+email)
          PY

      - name: Remove temporary public security routes
        shell: python
        run: |
          from pathlib import Path
          p=Path('onesignal-scheduler/src/master-rate-limit-production-entry.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import { deployFirestoreRulesV1 } from './firestore-rules-deploy-v1.js';\n",'')
          s=s.replace("import { runSecurityMaintenance, auditCommercialMigration } from './security-maintenance-v1.js';\n","import { runSecurityMaintenance } from './security-maintenance-v1.js';\n")
          start=s.find("      const url = new URL(request.url);\n      if (url.pathname === '/security/commercial-migration-ready'")
          end=s.find("      const accessResponse = await handleCommercialAccessStatus(request, env);",start)
          if start < 0 or end < 0:
              raise SystemExit('Temporary security route block not found')
          s=s[:start]+s[end:]
          p.write_text(s,encoding='utf-8')

      - name: Validate cleaned Worker
        working-directory: onesignal-scheduler
        run: |
          node --check src/master-rate-limit-production-entry.js
          npm test
          npx wrangler deploy --dry-run

      - name: Commit runtime cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onesignal-scheduler/src/master-rate-limit-production-entry.js
          git rm -f onesignal-scheduler/src/firestore-rules-deploy-v1.js
          git diff --cached --quiet || git commit -m "Remove temporary security deployment routes"
          git push origin main

      - name: Deploy cleaned Worker
        working-directory: onesignal-scheduler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirm temporary routes are closed
        shell: bash
        run: |
          BASE='https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev'
          for PATHNAME in security/commercial-migration-ready security/run-commercial-migration-once security/deploy-firestore-rules-v1; do
            CODE="$(curl --silent --output /tmp/body --write-out '%{http_code}' "$BASE/$PATHNAME")"
            echo "$PATHNAME -> HTTP $CODE"
            if [ "$CODE" = '200' ]; then
              echo "Temporary route unexpectedly remains available"
              cat /tmp/body
              exit 1
            fi
          done
