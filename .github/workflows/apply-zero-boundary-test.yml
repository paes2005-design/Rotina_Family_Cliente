name: Apply exact tolerance boundary test patch
on:
  push:
    branches: [test/tolerance-zero-boundary-v1]
    paths: ['patch-zero-boundary.mjs']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/tolerance-zero-boundary-v1
      - run: node patch-zero-boundary.mjs
      - name: Commit patched guard
        run: |
          if git diff --quiet; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client-time-guard-v2.js
          git commit -m 'Align final scoring with exact timer boundary'
          git push origin HEAD:test/tolerance-zero-boundary-v1
