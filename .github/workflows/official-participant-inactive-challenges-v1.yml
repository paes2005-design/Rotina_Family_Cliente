          checks={
            'filtro inativo':'cacheTarefasTodas=cacheTarefasGrupo.filter(tarefaVisivelParticipante)' in final,
            'pontuação hoje':'function historicoContaPontos(h)' in final and "formatarDataISO(new Date())" in final,
