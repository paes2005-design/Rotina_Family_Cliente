"""
          desafio_code="""        const REGRAS_DESAFIO={
            on_time_days:'Dias com todas as tarefas dentro do horário',
            tasks_100:'Tarefas consecutivas com 100%',
            no_justification_days:'Dias sem necessidade de justificativa',
            points:'Pontos atingidos',
            percent_points:'Percentual dos pontos possíveis'
        };
        function dataDesafio(x){return String(x?.data||x?.dataExecucao||x?.criadoEmIso||x?.criadoEm||'').slice(0,10);}
        function percentualDesafio(x){
            for(const v of [x?.percentualRevisado,x?.percentualAplicado])if(v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v)))return Math.max(0,Math.min(100,Math.round(Number(v))));
            const f=String(x?.faixaAtraso||'').toLowerCase(),st=String(x?.status||'').toLowerCase();
            if(f==='dentro-limites')return 100;if(f==='atraso-leve'||st.includes('75%'))return 75;if(f==='atraso-maior'||st.includes('50%'))return 50;if(f==='estourado'||st.includes('atrasado'))return 0;if(st.includes('prazo'))return 100;return null;
        }
        function registroFinalDesafio(x){return percentualDesafio(x)!==null||!!(x?.terminoExecutadoEm||x?.horarioTermino);}
        function diaSemanaData(iso){const [a,m,d]=String(iso).split('-').map(Number);return ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][new Date(a,m-1,d,12).getDay()];}
        function tarefasEsperadasNoDia(iso){const dia=diaSemanaData(iso);return cacheTarefasGrupo.filter(t=>tarefaVisivelParticipante(t)&&t.diaSemana===dia).length;}
        function limitesPeriodo(tipo){const n=new Date(),a=new Date(n.getFullYear(),n.getMonth(),n.getDate(),12);if(tipo==='month')return{ini:`${a.getFullYear()}-${String(a.getMonth()+1).padStart(2,'0')}-01`,fim:`${a.getFullYear()}-${String(a.getMonth()+1).padStart(2,'0')}-31`};const wd=(a.getDay()+6)%7,ini=new Date(a);ini.setDate(a.getDate()-wd);const fim=new Date(ini);fim.setDate(ini.getDate()+6);const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;return{ini:iso(ini),fim:iso(fim)};}
        function progressoDesafio(c){
            let hs=historicoPontuavel().filter(registroFinalDesafio);const inicio=String(c?.cicloIniciadoEm||c?.criadoEm||'').slice(0,10);if(inicio)hs=hs.filter(h=>!dataDesafio(h)||dataDesafio(h)>=inicio);
            if(c.tipo==='points')return hs.reduce((s,h)=>s+(Number(h.pontosGanhos)||0),0);
            if(c.tipo==='percent_points'){const b=limitesPeriodo(c.periodoPercentual==='month'?'month':'week'),r=hs.filter(h=>dataDesafio(h)>=b.ini&&dataDesafio(h)<=b.fim),ganho=r.reduce((s,h)=>s+(Number(h.pontosGanhos)||0),0),poss=r.reduce((s,h)=>s+(Number(h.pontosMaximos)||0),0);return poss?Math.round(ganho*100/poss):0;}
            if(c.tipo==='tasks_100'){const r=hs.slice().sort((a,b)=>`${dataDesafio(b)}${String(b.horarioTermino||b.terminoExecutadoEm||'')}`.localeCompare(`${dataDesafio(a)}${String(a.horarioTermino||a.terminoExecutadoEm||'')}`));let n=0;for(const h of r){if(percentualDesafio(h)===100)n++;else break;}return n;}
            const grupos={};for(const h of hs){const data=dataDesafio(h);if(data)(grupos[data]||(grupos[data]=[])).push(h);}const dias=Object.keys(grupos).sort(),ok={};for(const data of dias){const r=grupos[data],esperadas=tarefasEsperadasNoDia(data);if(!esperadas||r.length<esperadas){ok[data]=false;continue;}ok[data]=c.tipo==='on_time_days'?r.every(h=>percentualDesafio(h)===100):r.every(h=>!String(h.justificativaAtraso||'').trim()&&h.justificativaRecusada!==true);}if(c.modoContagem==='consecutive'){let n=0;for(const data of dias.slice().sort().reverse()){if(ok[data])n++;else if(tarefasEsperadasNoDia(data))break;}return n;}return dias.filter(data=>ok[data]).length;
        }
        function metaDesafio(c){const alvo=Number(c.meta)||0;if(c.tipo==='on_time_days'||c.tipo==='no_justification_days')return `${alvo} dia(s) ${c.modoContagem==='consecutive'?'consecutivos':'acumulados'}`;if(c.tipo==='tasks_100')return `${alvo} tarefa(s) consecutiva(s) com 100%`;if(c.tipo==='percent_points')return `${alvo}% dos pontos possíveis na ${c.periodoPercentual==='month'?'mensal':'semana'}`;return `${alvo} pontos${c.prazo==='with'?` em ${c.prazoValor} ${c.prazoUnidade==='days'?'dia(s)':c.prazoUnidade==='weeks'?'semana(s)':'mês(es)'}`:''}`;}
        function htmlDesafiosCliente(){
            if(!desafiosCache.length)return '<div style="margin-top:7px"><small>Nenhum desafio ativo.</small></div>';
            return desafiosCache.map(c=>{const progresso=progressoDesafio(c),meta=Math.max(1,Number(c.meta)||1),pct=Math.max(0,Math.min(100,Math.round(progresso*100/meta))),atingido=c.pendenteValidacao||progresso>=meta;return `<div style="margin-top:9px;padding:9px;border:1px solid #eee;border-radius:10px"><strong>🏆 ${escaparHtml(REGRAS_DESAFIO[c.tipo]||'Desafio')}</strong><br><small>Meta: ${escaparHtml(metaDesafio(c))}</small><br><small>Prêmio: ${escaparHtml(c.premio||'Não informado')}</small><div style="height:7px;background:#eee;border-radius:20px;overflow:hidden;margin-top:6px"><div style="height:100%;width:${pct}%;background:var(--cor-primaria)"></div></div><small>${progresso} / ${meta}${atingido?' · ✅ Meta atingida, aguardando ADM':''}</small></div>`;}).join('');
        }
        function renderizarRecompensasCliente(){
            const el=document.getElementById('recompensasCliente');if(!el)return; const saldo=saldoPontos();
"""
