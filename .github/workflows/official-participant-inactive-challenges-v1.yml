            'build novo':"const BUILD='20260905.1';" in shell.read_text(encoding='utf-8')
          }
          for nome,ok in checks.items():
              if not ok: raise SystemExit('Falha contratual: '+nome)
              print('OK',nome)

          # Checa sintaxe do módulo principal inline.
          mods=re.findall(r'<script type="module">(.*?)</script>',final,re.S)
          if not mods: raise SystemExit('script module principal não encontrado')
          Path('/tmp/client-main.mjs').write_text(max(mods,key=len),encoding='utf-8')
          PY

          node --check /tmp/client-main.mjs
          grep -q "match /conquistas/{id}" firestore.rules
          grep -q "const BUILD='20260905.1'" index.html
