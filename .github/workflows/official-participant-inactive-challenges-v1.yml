"""
          new_html="""            el.innerHTML=`<strong>Saldo disponível: ${saldo} pts</strong><div style="margin-top:12px"><strong>🏆 Desafios</strong>${htmlDesafiosCliente()}</div><div style="margin-top:12px"><strong>🎁 Catálogo</strong>${catalogo}</div><div style="margin-top:12px"><strong>Meus resgates de hoje</strong>${hist||'<br><small>Nenhum resgate solicitado hoje.</small>'}</div>`;
"""
