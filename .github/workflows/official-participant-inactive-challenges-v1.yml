name: Official Participant Inactive Challenges V1

on:
  push:
    paths:
      - '.github/triggers/official-participant-inactive-challenges-v1.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
