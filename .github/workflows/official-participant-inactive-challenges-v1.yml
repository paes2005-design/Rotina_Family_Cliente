name: Official Participant Inactive Challenges V1

on:
  push:
    paths:
      - '.github/triggers/official-participant-inactive-challenges-v1.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Aplicar integração no proprietário oficial
        run: python3 scripts/official-participant-inactive-challenges-v1.py

      - name: Validar sintaxe e contratos
        run: |
          set -euo pipefail
          node --check /tmp/client-main.mjs
          grep -q "function tarefaVisivelParticipante" index-CLIENTE-v6.html
          grep -q "historicoPontuavel().forEach" index-CLIENTE-v6.html
          grep -q "🏆 Desafios" index-CLIENTE-v6.html
          grep -q "match /conquistas/{id}" firestore.rules
          grep -q "const BUILD='20260905.1'" index.html
          git diff --check

      - name: Commit proprietário oficial
        run: |
          set -euo pipefail
          git config user.name "paes2005-design"
          git config user.email "paes2005@gmail.com"
          git add index-CLIENTE-v6.html firestore.rules index.html
          git commit -m "Participante: integra tarefas inativas e desafios"
          git push
