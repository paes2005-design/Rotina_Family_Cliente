name: Deploy Worker ADM Master e Comercial v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-worker-master-fix.yml'
      - 'onesignal-scheduler/src/index.js'
      - 'onesignal-scheduler/src/commercial-policy.js'
      - 'onesignal-scheduler/src/commercial-safe-v2-entry.js'
      - 'onesignal-scheduler/src/master-rate-limit-production-entry.js'
      - 'onesignal-scheduler/src/master-groups-index.js'
      - 'onesignal-scheduler/src/master-group-summary.js'
      - 'onesignal-scheduler/src/master-users-fallback.js'
      - 'onesignal-scheduler/src/master-logs-fallback.js'
      - 'onesignal-scheduler/wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onesignal-scheduler
    steps:
      - uses: actions/checkout@v4

      - name: Checkout approved ADM tree baseline
        uses: actions/checkout@v4
        with:
          repository: paes2005-design/Rotina_Family_ADM
          ref: main
          path: adm-tree

      - name: Validate approved family tree baseline
        shell: python
        run: |
          from pathlib import Path
          tree=Path('../adm-tree/master-family-tree.js').read_text(encoding='utf-8')
          entry=Path('../adm-tree/index.html').read_text(encoding='utf-8')
          assert "const COMMERCIAL_EXEMPT_GROUPS = new Set(['CLI-4071'])" in tree
          assert 'Administrador principal' in tree
          assert 'Clientes / integrantes' in tree
          assert 'set-group-blocked' in tree
          assert 'confirm-group' in tree
          assert 'ADM Master nunca participa do bloqueio comercial' in tree
          assert 'delete-profile' not in tree
          assert 'set-group-disabled' not in tree
          assert "const MASTER_OPERATIONAL_BASE_GROUP = 'CLI-4071'" in entry
          assert 'masterOperationalProfiles' in entry
          assert "window.rotinaMasterApi('/group?grupoId='" in entry
          assert 'window.rotinaMasterSincronizarIntegrantes' in entry
          print('ARVORE APROVADA: grupo -> principal -> integrantes, bloqueio por grupo e CLI-4071 preservado')

      - name: Install dependencies
        run: npm ci
      - name: Validate existing Worker regressions
        run: npm run check && npm test
      - name: Validate commercial policy
        run: node test/commercial-safety.test.mjs
      - name: Syntax check production modules
        run: |
          node --check src/commercial-policy.js
          node --check src/commercial-safe-v2-entry.js
          node --check src/master-rate-limit-production-entry.js
          node --check src/master-groups-index.js
          node --check src/master-group-summary.js
          node --check src/master-users-fallback.js
          node --check src/master-logs-fallback.js
      - name: Production invariants
        shell: python
        run: |
          from pathlib import Path
          prod=Path('src/master-rate-limit-production-entry.js').read_text(encoding='utf-8')
          safe=Path('src/commercial-safe-v2-entry.js').read_text(encoding='utf-8')
          policy=Path('src/commercial-policy.js').read_text(encoding='utf-8')
          wrangler=Path('wrangler.jsonc').read_text(encoding='utf-8')
          assert "import app from './commercial-safe-v2-entry.js'" in prod
          assert 'commercial-preview-entry' not in prod
          assert 'master-user-actions-preview' not in prod
          assert "body.action==='set-group-blocked'" in safe or "body.action === 'set-group-blocked'" in safe
          assert "body.action==='confirm-group'" in safe or "body.action === 'confirm-group'" in safe
          assert 'COMMERCIAL_TRIAL_DAYS = 15' in policy
          assert "COMMERCIAL_EXEMPT_GROUPS = Object.freeze(['CLI-4071'])" in policy
          assert 'mustMutateFirebaseAuthForFamilyBlock' in policy
          assert 'IDENTITY_TOOLKIT' not in safe and 'disableUser' not in safe
          assert '"main": "src/master-rate-limit-production-entry.js"' in wrangler
          assert 'COMMERCIAL_TEST_DRY_RUN' not in wrangler
          print('Produção segura: árvore aprovada + Master + grupos + logs + trial 15 dias OK')
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Mark successful commercial production deploy
        working-directory: .
        run: |
          mkdir -p .deploy
          printf 'status=success\npackage=commercial-v2\nsource_sha=%s\ncompleted_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/commercial-v2-last-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/commercial-v2-last-success.txt
          if git diff --cached --quiet; then
            echo 'Marcador já está atualizado.'
          else
            git commit -m "Deploy: confirmar pacote comercial v2 em produção"
            git push
          fi

# O marcador .deploy/commercial-v2-last-success.txt só é gravado após o Cloudflare aceitar o deploy.
# O ADM Master continua independente de CLI/grupo/comercial.
# Bloqueio familiar altera somente configGrupos/<CLI>; nunca Firebase Authentication.
# Logs globais permanecem sob demanda no ADM Master.
