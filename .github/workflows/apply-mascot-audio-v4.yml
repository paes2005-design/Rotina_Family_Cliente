name: Apply mascot audio v4
on:
  push:
    paths:
      - '.github/workflows/apply-mascot-audio-v4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dog bark and mascot parity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re

          bark_b64=''
          audio=Path('latido-cachorro-comemoracao.mp3')
          audio.write_bytes(base64.b64decode(bark_b64))

          p=Path('client-mascot-rewards.js')
          s=p.read_text()
          repl="""function barkSound(){\n  try{\n    const audio=new Audio('./latido-cachorro-comemoracao.mp3?v=1');\n    audio.preload='auto';\n    audio.volume=1;\n    audio.play().catch(()=>{});\n  }catch{}\n}\n\nfunction meowSound()"""
          s2,n=re.subn(r"function barkSound\(\)\{[\s\S]*?\n\}\n\nfunction meowSound\(\)",repl,s,count=1)
          if n!=1: raise SystemExit('barkSound patch failed')
          old="if(name==='bark'){speech.classList.remove('show');void speech.getBoundingClientRect();speech.classList.add('show');animal.classList.add('bark');mascotSound();setTimeout(mascotSound,330);}else animal.classList.add(name);"
          new="if(name==='bark'){speech.classList.remove('show');void speech.getBoundingClientRect();speech.classList.add('show');animal.classList.add('bark');if(mascotType()==='dog'){barkSound();setTimeout(barkSound,460);}else{meowSound();setTimeout(meowSound,460);}}else animal.classList.add(name);"
          if old not in s2: raise SystemExit('action patch target missing')
          s2=s2.replace(old,new,1)
          old_run="async function runSequence(sequence){\n  const layer=ensureLayer();\n  for(const step of sequence.steps)await action(step);"
          new_run="async function runSequence(sequence){\n  const layer=ensureLayer();\n  try{window.confetti?.({particleCount:70,spread:78,origin:{y:.72}});}catch{}\n  for(const step of sequence.steps)await action(step);"
          if old_run not in s2: raise SystemExit('runSequence patch target missing')
          s2=s2.replace(old_run,new_run,1)
          p.write_text(s2)

          ui=Path('client-ui-pro.js')
          u=ui.read_text().replace("import('./client-mascot-rewards.js?v=3')","import('./client-mascot-rewards.js?v=4')")
          ui.write_text(u)

          idx=Path('index.html')
          x=idx.read_text().replace("./client-ui-pro.js?v=29","./client-ui-pro.js?v=30").replace("./sw.js?v=32","./sw.js?v=33")
          idx.write_text(x)

          sw=Path('sw.js')
          w=sw.read_text().replace("rotina-family-cliente-v43","rotina-family-cliente-v44")
          if "'./latido-cachorro-comemoracao.mp3'" not in w:
              w=w.replace("'./client-mascot-rewards.js','./mascot-reward-core.js'","'./client-mascot-rewards.js','./latido-cachorro-comemoracao.mp3','./mascot-reward-core.js'")
          sw.write_text(w)

          Path('.github/workflows/apply-mascot-audio-v4.yml').unlink()
          PY
          node --check client-mascot-rewards.js
          node --check client-ui-pro.js
          node --check sw.js
          test -s latido-cachorro-comemoracao.mp3
      - name: Commit changes
        run: |
          git config user.name 'paes2005-design'
          git config user.email 'paes2005@gmail.com'
          git add -A
          git commit -m 'feat: usar latido real duplo e igualar fogos dos mascotes'
          git push
