name: Patch Client scoring and mobile UI
on:
  push:
    paths:
      - '.github/workflows/patch-client-audit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and test patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index-CLIENTE-v6.html')
          s=p.read_text()

          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'Patch marker not found: {label}')
              s=s.replace(old,new,1)

          rep('    <link rel="icon" type="image/png" sizes="192x192" href="icon-cliente-192.png">',
              '    <link rel="icon" type="image/png" sizes="192x192" href="icon-cliente-192.png">\n    <link rel="stylesheet" href="./client-ui-pro.css">',
              'client css')

          rep("            const limiteInicio=converterHoraParaMinutos(tarefa.horaSugeridaInicio)+tolerancia;\n            const limiteAtrasoLeve=limiteInicio+Math.ceil(tolerancia/2);\n            const limiteFinal=converterHoraParaMinutos(tarefa.horaSugeridaFim)+tolerancia;\n            const estourouFinal=minTermino>limiteFinal || minInicioReal>limiteFinal || tarefa.iniciouAposLimiteFinal===true;",
              "            const limiteInicio=converterHoraParaMinutos(tarefa.horaSugeridaInicio)+tolerancia;\n            const limiteFinal=converterHoraParaMinutos(tarefa.horaSugeridaFim)+tolerancia;\n            // Mede o atraso REAL além da tolerância. Ex.: tolerância 2 min, 1 min além => faixa de 75%.\n            const minutosAlemTolerancia=Math.max(0,minInicioReal-limiteInicio);\n            const faixaLeveMinutos=tolerancia>0?Math.max(1,Math.ceil(tolerancia/2)):0;\n            const estourouFinal=minTermino>limiteFinal || minInicioReal>limiteFinal || tarefa.iniciouAposLimiteFinal===true;",
              'scoring thresholds')

          rep("                if(minInicioReal>limiteInicio && minInicioReal<=limiteAtrasoLeve){ percentual=regraAtrasoAtual.atrasoLeve; faixa='atraso-leve'; }\n                else if(minInicioReal>limiteAtrasoLeve){ percentual=regraAtrasoAtual.atrasoMaior; faixa='atraso-maior'; }",
              "                if(minutosAlemTolerancia>0 && minutosAlemTolerancia<=faixaLeveMinutos){ percentual=regraAtrasoAtual.atrasoLeve; faixa='atraso-leve'; }\n                else if(minutosAlemTolerancia>faixaLeveMinutos){ percentual=regraAtrasoAtual.atrasoMaior; faixa='atraso-maior'; }",
              'scoring selection')

          rep("await updateDoc(doc(db,'tarefas',id),{horarioTermino:hora,status,pontosGanhos:pts,percentualAplicado:percentual,faixaAtraso:faixa});",
              "await updateDoc(doc(db,'tarefas',id),{horarioTermino:hora,status,pontosGanhos:pts,percentualAplicado:percentual,faixaAtraso:faixa,minutosAlemTolerancia,faixaLeveMinutos});",
              'task audit fields')

          rep("iniciouComAtraso:!!tarefa.iniciouComAtraso,percentualAplicado:percentual,faixaAtraso:faixa,regraAtrasoAplicada:{...regraAtrasoAtual}",
              "iniciouComAtraso:!!tarefa.iniciouComAtraso,minutosAlemTolerancia,faixaLeveMinutos,percentualAplicado:percentual,faixaAtraso:faixa,regraAtrasoAplicada:{...regraAtrasoAtual}",
              'history audit fields')

          rep("if(t&&t.status==='Atrasado')", "if(t&&t.status?.includes('Atrasado'))", 'justification status')

          rep("    </script>\n    <script>\n      if ('serviceWorker' in navigator)",
              "    </script>\n    <script src=\"./client-ui-pro.js\"></script>\n    <script>\n      if ('serviceWorker' in navigator)",
              'client ui script')

          p.write_text(s)

          # Deterministic scoring boundary tests.
          def faixa(inicio, fim, ini_prog, fim_prog, tol):
              limite_ini=ini_prog+tol
              limite_fim=fim_prog+tol
              alem=max(0,inicio-limite_ini)
              leve=max(1,(tol+1)//2) if tol>0 else 0
              if fim>limite_fim or inicio>limite_fim: return 0
              if alem==0: return 100
              if alem<=leve: return 75
              return 50
          cases=[
              ((8*60+2,8*60+30,8*60,8*60+30,2),100),
              ((8*60+3,8*60+30,8*60,8*60+30,2),75),
              ((8*60+4,8*60+30,8*60,8*60+30,2),50),
              ((8*60+3,8*60+33,8*60,8*60+30,2),0),
              ((8*60+11,8*60+35,8*60,8*60+30,10),75),
              ((8*60+16,8*60+35,8*60,8*60+30,10),50),
          ]
          for args,expected in cases:
              got=faixa(*args)
              assert got==expected,(args,got,expected)
          print('Scoring boundary tests: OK')
          PY
          rm .github/workflows/patch-client-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-CLIENTE-v6.html .github/workflows/patch-client-audit.yml
          git commit -m "Fix scoring boundaries and load Client task UI"
          git push
