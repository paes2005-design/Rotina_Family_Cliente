name: Refactor alarm v15 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-alarm-v15-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refactor alarm runtime to single owner
        run: python tools/refactor_alarm_v15.py

      - name: Validate clean alarm runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check family-alarm-client.js
          node --check client-bootstrap-v1.js
          node --check runtime-build-info.js
          node --check security-tests/firestore-rules.test.mjs
          test "$(grep -c "alarm-stop-retry" client-bootstrap-v1.js || true)" -eq 0
          test "$(grep -c "persistence-guard" client-bootstrap-v1.js || true)" -eq 0
          test "$(grep -c "family-alarm-loader" client-bootstrap-v1.js || true)" -eq 0
          test "$(grep -c "getDocs\|getDoc\|onSnapshot" family-alarm-client.js || true)" -eq 0
          grep -q "family-alarm-client.js?v=15" client-bootstrap-v1.js
          grep -q "JANELA_DISPARO_MS=60\*1000" family-alarm-client.js
          grep -q "ativoPermanece" family-alarm-client.js
          grep -q "updateDoc" family-alarm-client.js

      - name: Commit refactor and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rotina-family-refactor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/refactor-alarm-v15-once.yml tools/refactor_alarm_v15.py
          git add -A
          git commit -m 'refactor: consolidate participant alarm state owner v15'
          git push origin HEAD:main
