name: Fix and run commercial migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-fix-and-run-commercial-migration.yml'

permissions:
  contents: write

jobs:
  fix-test-deploy-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix migration variable
        shell: python
        run: |
          from pathlib import Path
          p=Path('onesignal-scheduler/src/security-maintenance-v1.js')
          s=p.read_text(encoding='utf-8')
          old="const commercial = {grupoId, atualizadoEmMigracao:now.toISOString()};"
          new="const commercial = {grupoId:groupId, atualizadoEmMigracao:now.toISOString()};"
          if old not in s and new not in s:
              raise SystemExit('Migration variable marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Validate Worker
        working-directory: onesignal-scheduler
        run: |
          npm ci
          node --check src/security-maintenance-v1.js
          node --check src/master-rate-limit-production-entry.js
          npm test
          npx wrangler deploy --dry-run

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onesignal-scheduler/src/security-maintenance-v1.js
          git diff --cached --quiet || git commit -m "Fix commercial state migration group id"
          git push origin main

      - name: Deploy Worker
        working-directory: onesignal-scheduler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Execute migration and verify clean state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev'
          BODY="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 -X POST "$BASE/security/run-commercial-migration-once")"
          echo "Migration execution: $BODY"
          AUDIT="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE/security/commercial-migration-ready")"
          echo "Migration audit: $AUDIT"
          python3 - "$BODY" "$AUDIT" <<'PY'
          import json,sys
          execution=json.loads(sys.argv[1])
          audit=json.loads(sys.argv[2])
          assert execution.get('ok') is True, execution
          assert audit.get('ready') is True, audit
          assert audit.get('markerComplete') is True, audit
          assert int(audit.get('remainingLegacy',-1)) == 0, audit
          print('COMMERCIAL MIGRATION CLEAN')
          PY
