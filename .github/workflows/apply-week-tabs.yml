name: Aplicar navegação semanal Rotina Family

on:
  push:
    paths:
      - '.github/workflows/apply-week-tabs.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar layout aprovado com abas da semana
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index-CLIENTE-v6.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 ocorrência, encontrado {count}')
              text = text.replace(old, new, 1)

          replace_once('<h2>Bem-vindo(a) ao Metas!</h2>', '<h2>Rotina Family</h2>', 'título do login')
          replace_once('<button onclick="conectarCliente()">Entrar no Meu Espaço</button>', '<button onclick="conectarCliente()">Entrar</button>', 'botão do login')

          css = r'''
        /* Navegação semanal — mantém o layout e as regras existentes */
        .week-tabs-wrap {
            margin-top: 24px;
            padding: 10px 10px calc(8px + env(safe-area-inset-bottom));
            background: rgba(255,255,255,.96);
            border: 1px solid rgba(148,163,184,.24);
            border-radius: 22px;
            box-shadow: 0 10px 28px rgba(15,23,42,.10);
            position: sticky;
            bottom: 8px;
            z-index: 80;
            backdrop-filter: blur(12px);
        }
        .week-tabs {
            display: grid;
            grid-template-columns: repeat(7, minmax(42px,1fr));
            gap: 7px;
            align-items: center;
        }
        .week-tab {
            border: 0;
            min-height: 46px;
            border-radius: 16px;
            color: #fff;
            font-weight: 800;
            font-size: .88rem;
            cursor: pointer;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,.08), 0 4px 10px rgba(15,23,42,.09);
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .week-tab:nth-child(1) { background: #ff4d6d; }
        .week-tab:nth-child(2) { background: #ff914d; }
        .week-tab:nth-child(3) { background: #f6bE2c; }
        .week-tab:nth-child(4) { background: #43c77a; }
        .week-tab:nth-child(5) { background: #3d9bf2; }
        .week-tab:nth-child(6) { background: #9b6ee8; }
        .week-tab:nth-child(7) { background: #f47fa0; }
        .week-tab:hover { filter: brightness(1.04); transform: translateY(-1px); }
        .week-tab.is-selected {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 8px 18px rgba(255,77,109,.28), inset 0 -2px 0 rgba(0,0,0,.08);
            outline: 3px solid rgba(255,255,255,.95);
        }
        .week-tab.is-today::before { content: '★ '; color: #fff5a8; }
        .week-cache-status {
            text-align: center;
            margin-top: 7px;
            color: #16a34a;
            font-size: .76rem;
            font-weight: 700;
        }
        .week-readonly {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #64748b;
            font-size: .76rem;
            font-weight: 700;
            white-space: nowrap;
        }
        @media (max-width: 700px) {
            body { padding: 10px; padding-bottom: 0; }
            .app-container { padding: 18px 12px 14px; border-radius: 20px; }
            .week-tabs-wrap { margin-left: -4px; margin-right: -4px; bottom: 4px; padding-left: 7px; padding-right: 7px; border-radius: 20px; }
            .week-tabs { gap: 5px; }
            .week-tab { min-height: 44px; border-radius: 14px; font-size: .76rem; padding: 0 3px; }
        }
'''
          replace_once('    </style>\n</head>', css + '    </style>\n</head>', 'CSS semanal')

          nav = r'''
        <div class="week-tabs-wrap" id="semanaNavWrap" aria-label="Navegação pelos dias da semana">
            <div class="week-tabs" id="semanaNav"></div>
            <div class="week-cache-status" id="semanaCacheStatus">☁️ Semana em cache</div>
        </div>
'''
          replace_once('        </table>\n    </div>\n\n    <script type="module">', '        </table>\n' + nav + '    </div>\n\n    <script type="module">', 'barra semanal')

          replace_once('        const diaAtualTexto = diasSemana[new Date().getDay()];', '        const diaAtualTexto = diasSemana[new Date().getDay()];\n        let diaSelecionadoTexto = diaAtualTexto;', 'dia selecionado')

          replace_once("            document.getElementById('txtDiaSemana').innerText='Acompanhe suas janelas de prazos diários!';\n            await verificarEExecutarResetSemanal(codigoGrupo); inicializarEscutasFirebase();", "            document.getElementById('txtDiaSemana').innerText='Acompanhe suas janelas de prazos diários!';\n            renderizarAbasSemana();\n            await verificarEExecutarResetSemanal(codigoGrupo); inicializarEscutasFirebase();", 'inicialização das abas')

          replace_once('                renderizarTarefasHoje(); atualizarPainelPontos(); atualizarConquistas();', '                renderizarTarefasHoje(); renderizarAbasSemana(); atualizarPainelPontos(); atualizarConquistas();', 'atualização das abas')

          marker = '''        function renderizarTarefasHoje(){\n'''
          weekly_js = r'''        const ordemAbasSemana = [
            {dia:'Segunda',rotulo:'Seg'},
            {dia:'Terça',rotulo:'Ter'},
            {dia:'Quarta',rotulo:'Qua'},
            {dia:'Quinta',rotulo:'Qui'},
            {dia:'Sexta',rotulo:'Sex'},
            {dia:'Sábado',rotulo:'Sáb'},
            {dia:'Domingo',rotulo:'Dom'}
        ];

        function tarefasDoDiaSelecionado(){
            return cacheTarefasTodas
                .filter(t=>t.diaSemana===diaSelecionadoTexto)
                .sort((a,b)=>(a.horaSugeridaInicio||'').localeCompare(b.horaSugeridaInicio||''));
        }

        function renderizarAbasSemana(){
            const nav=document.getElementById('semanaNav');
            if(!nav)return;
            nav.innerHTML=ordemAbasSemana.map(({dia,rotulo})=>{
                const selecionada=dia===diaSelecionadoTexto?' is-selected':'';
                const hoje=dia===diaAtualTexto?' is-today':'';
                const atual=dia===diaAtualTexto?'true':'false';
                return `<button type="button" class="week-tab${selecionada}${hoje}" aria-current="${atual}" aria-label="${escaparHtml(diasSemanaExibicao[dia]||dia)}" onclick="selecionarDiaSemana('${dia}')">${rotulo}</button>`;
            }).join('');
        }

        window.selecionarDiaSemana=(dia)=>{
            if(!diasSemana.includes(dia))return;
            diaSelecionadoTexto=dia;
            renderizarAbasSemana();
            renderizarTarefasHoje();
            const subtitulo=document.getElementById('txtDiaSemana');
            if(subtitulo){
                subtitulo.innerText=dia===diaAtualTexto
                    ? 'Acompanhe suas janelas de prazos diários!'
                    : `Consultando ${diasSemanaExibicao[dia]||dia}. As ações ficam disponíveis no dia correspondente.`;
            }
        };

'''
          if marker not in text:
              raise SystemExit('função renderizarTarefasHoje não encontrada')
          text = text.replace(marker, weekly_js + marker, 1)

          replace_once("            const tbody=document.getElementById('tabelaCorpo'); tbody.innerHTML='';\n            if(!cacheTarefasHoje.length){tbody.innerHTML='<tr><td colspan=\"4\" style=\"text-align:center\">Nenhuma tarefa cadastrada para hoje.</td></tr>';return;}\n            let concluidas=0;\n            cacheTarefasHoje.forEach(dados=>{", "            const tbody=document.getElementById('tabelaCorpo'); tbody.innerHTML='';\n            const tarefasVisiveis=diaSelecionadoTexto===diaAtualTexto ? cacheTarefasHoje : tarefasDoDiaSelecionado();\n            if(!tarefasVisiveis.length){tbody.innerHTML=`<tr><td colspan=\"4\" style=\"text-align:center\">Nenhuma tarefa cadastrada para ${escaparHtml(diasSemanaExibicao[diaSelecionadoTexto]||diaSelecionadoTexto)}.</td></tr>`;return;}\n            const podeExecutarHoje=diaSelecionadoTexto===diaAtualTexto;\n            let concluidas=0;\n            tarefasVisiveis.forEach(dados=>{", 'fonte das tarefas visíveis')

          pattern = re.compile(r"                let cls='status-pendente',acao=''; if\(status==='Pendente'\)acao=`<button class=\"btn btn-iniciar\" onclick=\"iniciarTarefa\('\$\{dados\.id\}'\)\">Iniciar</button>`; else if\(status==='Em andamento'\)\{cls='status-andamento';acao=`<button class=\"btn btn-finalizar\" onclick=\"finalizarTarefa\('\$\{dados\.id\}'\)\">Finalizar</button>`;\} else if\(status\.includes\('Prazo'\)\)\{cls='status-prazo';acao='🎉';\} else \{cls='status-atrasado';acao='⏰';\}")
          replacement = """                let cls='status-pendente',acao='';
                if(status==='Em andamento') cls='status-andamento'; else if(status.includes('Prazo')) cls='status-prazo'; else if(status.includes('Atrasado')) cls='status-atrasado';
                if(!podeExecutarHoje) acao='<span class=\"week-readonly\">Consulta</span>';
                else if(status==='Pendente') acao=`<button class=\"btn btn-iniciar\" onclick=\"iniciarTarefa('${dados.id}')\">Iniciar</button>`;
                else if(status==='Em andamento') acao=`<button class=\"btn btn-finalizar\" onclick=\"finalizarTarefa('${dados.id}')\">Finalizar</button>`;
                else if(status.includes('Prazo')) acao='🎉'; else acao='⏰';"""
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'linha de ação das tarefas: esperado 1, encontrado {n}')

          replace_once("            const todas=concluidas===cacheTarefasHoje.length, perdeuPontualidade=cacheTarefasHoje.some(t=>t.status?.includes('Atrasado') || (t.faixaAtraso && t.faixaAtraso!=='dentro-limites') || (!t.faixaAtraso && t.iniciouComAtraso)); if(todas&&!perdeuPontualidade&&!sessionStorage.getItem('parabens_mostrado_'+diaAtualTexto)) triggerCelebracao100();", "            const todas=podeExecutarHoje&&concluidas===cacheTarefasHoje.length, perdeuPontualidade=cacheTarefasHoje.some(t=>t.status?.includes('Atrasado') || (t.faixaAtraso && t.faixaAtraso!=='dentro-limites') || (!t.faixaAtraso && t.iniciouComAtraso)); if(todas&&!perdeuPontualidade&&!sessionStorage.getItem('parabens_mostrado_'+diaAtualTexto)) triggerCelebracao100();", 'celebração somente hoje')

          replace_once("navigator.serviceWorker.register('./sw.js?v=25')", "navigator.serviceWorker.register('./sw.js?v=26')", 'versão do service worker no HTML')

          path.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          if "rotina-family-cliente-v25" not in sw_text:
              raise SystemExit('cache v25 não encontrado no sw.js')
          sw_text = sw_text.replace("rotina-family-cliente-v25", "rotina-family-cliente-v26", 1)
          sw.write_text(sw_text, encoding='utf-8')

          # Verificações para não publicar uma alteração incompleta.
          checks = [
              ('Rotina Family</h2>', 'nome no login'),
              ('id="semanaNav"', 'navegação semanal'),
              ('diaSelecionadoTexto', 'estado da aba selecionada'),
              ('Semana em cache', 'indicador de cache'),
              ("./sw.js?v=26", 'service worker v26'),
          ]
          final = path.read_text(encoding='utf-8')
          for needle,label in checks:
              if needle not in final:
                  raise SystemExit(f'falha de verificação: {label}')
          print('Alterações validadas com sucesso.')
          PY

      - name: Remover workflow temporário e publicar
        shell: bash
        run: |
          rm -f .github/workflows/apply-week-tabs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-CLIENTE-v6.html sw.js .github/workflows/apply-week-tabs.yml
          git commit -m 'Add weekly tabs to Rotina Family client'
          git push
