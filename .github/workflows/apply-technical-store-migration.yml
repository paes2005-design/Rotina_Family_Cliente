name: Aplicar migracao tecnica Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-technical-store-migration.yml'
      - 'onesignal-scheduler/scripts/apply-technical-store-migration.py'

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migracao no Worker
        run: python onesignal-scheduler/scripts/apply-technical-store-migration.py
      - name: Validar sintaxe do Worker
        run: |
          node --check onesignal-scheduler/src/index.js
          node --check onesignal-scheduler/src/technical-store-do.js
          cd onesignal-scheduler
          node test/scheduler-write-budget.test.mjs
          npm test
      - name: Persistir fonte migrada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onesignal-scheduler/src/index.js
          if git diff --cached --quiet; then
            echo 'Migração já aplicada.'
          else
            git commit -m "Migrar logs e saúde para Cloudflare Durable Object"
            git push
          fi
