name: Dispatch Firestore Rules V1

on:
  push:
    paths:
      - '.github/triggers/dispatch-firestore-rules-v1.txt'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Acionar publicador oficial de regras
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run security-deploy-firestore-rules-v1.yml --repo "$GITHUB_REPOSITORY" --ref main
