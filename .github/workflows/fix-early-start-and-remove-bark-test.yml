name: Fix early start and remove bark test
on:
  push:
    paths:
      - '.github/workflows/fix-early-start-and-remove-bark-test.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Remove only the temporary bark test UI. Keep the approved AU AU engine unchanged.
          p=Path('client-dog-bark-mobile.js')
          s=p.read_text()
          start=s.find('function ensureTestButton(){')
          end=s.find('\nfunction scanTaskTransitions(){', start)
          if start < 0 or end < 0:
              raise SystemExit('temporary bark test function not found')
          s=s[:start]+s[end+1:]
          s=s.replace('function scanTaskTransitions(){\n  ensureTestButton();','function scanTaskTransitions(){',1)
          s=s.replace("setTimeout(()=>{ensureTestButton();scanTaskTransitions();},0);","setTimeout(scanTaskTransitions,0);",1)
          s=s.replace("window.testarLatidoCachorroNoApp=()=>playDoubleBark('teste-manual-app');\n\n",'',1)
          s=s.replace("if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{ensureTestButton();scanTaskTransitions();},{once:true});\nelse{ensureTestButton();scanTaskTransitions();}","if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',scanTaskTransitions,{once:true});\nelse scanTaskTransitions();",1)
          s=s.replace("log('cachorro.modulo_latido_mobile_pronto',{versao:2});","log('cachorro.modulo_latido_mobile_pronto',{versao:3});",1)
          if 'testeLatidoCachorroApp' in s or 'ensureTestButton' in s:
              raise SystemExit('temporary bark test UI still present')
          p.write_text(s)

          # 2) Speed up early-start order check using the already-rendered task list.
          p=Path('client-time-guard-v2.js')
          s=p.read_text()
          old="""async function verificarOrdem(t){
  const banco=await db(),g=grupo();if(!g)return {permitida:true};
  const s=await getDocs(query(collection(banco,'tarefas'),where('grupoId','==',g)));
  const lista=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>(x.perfilId?x.perfilId===perfil():x.perfilNome===nome())&&x.diaSemana===t.diaSemana).sort((a,b)=>(a.horaSugeridaInicio||'').localeCompare(b.horaSugeridaInicio||''));
  return avaliarOrdemLista(lista,t);
}"""
          new="""function verificarOrdemRenderizada(t){
  const rows=[...document.querySelectorAll('#tabelaCorpo tr[data-family-task-id]')];
  if(!rows.length)return null;
  const lista=rows.map(row=>({
    id:String(row.dataset.familyTaskId||'').trim(),
    status:String(row.dataset.familyTaskStatus||'Pendente').trim()||'Pendente',
    nome:row.children?.[1]?.querySelector('strong')?.textContent?.trim()||''
  })).filter(x=>x.id);
  if(!lista.some(x=>x.id===t.id))return null;
  return avaliarOrdemLista(lista,t);
}
async function verificarOrdem(t){
  const local=verificarOrdemRenderizada(t);
  if(local)return local;
  const banco=await db(),g=grupo();if(!g)return {permitida:true};
  const s=await getDocs(query(collection(banco,'tarefas'),where('grupoId','==',g)));
  const lista=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>(x.perfilId?x.perfilId===perfil():x.perfilNome===nome())&&x.diaSemana===t.diaSemana).sort((a,b)=>(a.horaSugeridaInicio||'').localeCompare(b.horaSugeridaInicio||''));
  return avaliarOrdemLista(lista,t);
}"""
          if old not in s:
              raise SystemExit('order function target not found')
          s=s.replace(old,new,1)

          # 3) Save task + execution record concurrently instead of sequentially.
          old="""  await updateDoc(doc(banco,'tarefas',t.id),dados);
  await setDoc(doc(banco,'execucoes',`${dataISO(j.ocorr)}__${t.id}`),{grupoId:grupo(),perfilId:perfil(),perfilNome:nome(),tarefaId:t.id,nomeTarefa:t.nome,data:dataISO(j.ocorr),...dados},{merge:true});"""
          new="""  await Promise.all([
    updateDoc(doc(banco,'tarefas',t.id),dados),
    setDoc(doc(banco,'execucoes',`${dataISO(j.ocorr)}__${t.id}`),{grupoId:grupo(),perfilId:perfil(),perfilNome:nome(),tarefaId:t.id,nomeTarefa:t.nome,data:dataISO(j.ocorr),...dados},{merge:true})
  ]);"""
          if old not in s:
              raise SystemExit('start writes target not found')
          s=s.replace(old,new,1)

          # 4) The task/order were already validated before the modal opened. Do not re-query twice after the user selects a reason.
          old="""    confirm.disabled=true;cancel.disabled=true;err.style.display='none';confirm.textContent='Verificando...';
    try{
      const atual=await buscarTarefa(t.id);if(!atual||(atual.status||'Pendente')!=='Pendente'){m.remove();return;}
      const ordem=await verificarOrdem(atual);if(!ordem.permitida){m.remove();avisarBloqueioOrdem(ordem);return;}
      const agora2=new Date(),j2=janela(atual,agora2);
      confirm.textContent='Iniciando...';
      await registrarInicio(atual,agora2,j2,agora2<j2.inicio?{tipo:selecionado,motivo}:null);
      m.remove();
    }catch(e){console.error('Início antecipado:',e);confirm.disabled=false;cancel.disabled=false;confirm.textContent='Justificar e iniciar';err.textContent='Não foi possível iniciar agora. Tente novamente.';err.style.display='block';}"""
          new="""    if(confirm.dataset.busy==='1')return;
    confirm.dataset.busy='1';confirm.disabled=true;cancel.disabled=true;err.style.display='none';confirm.textContent='Iniciando...';
    const iniciadoEm=performance.now();
    try{
      const agora2=new Date(),j2=janela(t,agora2);
      await registrarInicio(t,agora2,j2,agora2<j2.inicio?{tipo:selecionado,motivo}:null);
      window.rotinaLog?.('tarefa.inicio_antecipado_ok',{tarefaId:t.id,tempoMs:Math.round(performance.now()-iniciadoEm),motivoTipo:selecionado});
      m.remove();
    }catch(e){console.error('Início antecipado:',e);delete confirm.dataset.busy;confirm.disabled=false;cancel.disabled=false;confirm.textContent='Justificar e iniciar';err.textContent='Não foi possível iniciar agora. Tente novamente.';err.style.display='block';window.rotinaLog?.('tarefa.inicio_antecipado_erro',{tarefaId:t.id,mensagem:String(e?.message||e)},'error');}"""
          if old not in s:
              raise SystemExit('early confirm target not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 5) Force fresh mobile assets and cache the dedicated bark module for offline use.
          p=Path('client-ui-pro.js')
          s=p.read_text().replace("import('./client-dog-bark-mobile.js?v=1')","import('./client-dog-bark-mobile.js?v=2')")
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace("./client-ui-pro.js?v=31","./client-ui-pro.js?v=32").replace("./sw.js?v=33","./sw.js?v=34")
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text().replace("rotina-family-cliente-v44","rotina-family-cliente-v45")
          if "'./client-dog-bark-mobile.js'" not in s:
              s=s.replace("'./client-mascot-rewards.js'","'./client-dog-bark-mobile.js','./client-mascot-rewards.js'",1)
          p.write_text(s)

          # Self-delete this one-shot workflow after applying the patch.
          Path('.github/workflows/fix-early-start-and-remove-bark-test.yml').unlink()
          PY

          node --check client-dog-bark-mobile.js
          node --check client-time-guard-v2.js
          node --check client-ui-pro.js
          node --check sw.js
          grep -q "DOG_BARK_URL='./latido-cachorro-comemoracao.mp3?v=5'" client-dog-bark-mobile.js
          grep -q "GAP_SECONDS=0.08" client-dog-bark-mobile.js
          ! grep -q 'testeLatidoCachorroApp' client-dog-bark-mobile.js
          grep -q 'verificarOrdemRenderizada' client-time-guard-v2.js
          grep -q "tarefa.inicio_antecipado_ok" client-time-guard-v2.js
      - name: Commit fixes
        run: |
          git config user.name 'paes2005-design'
          git config user.email 'paes2005@gmail.com'
          git add -A
          git commit -m 'fix: agilizar início antecipado e remover teste de latido'
          git push
