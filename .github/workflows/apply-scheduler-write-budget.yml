name: Aplicar otimizacao de gravacoes do scheduler

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-scheduler-write-budget.yml'
      - 'onesignal-scheduler/scripts/apply-scheduler-write-budget.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar orçamento de gravações
        run: python onesignal-scheduler/scripts/apply-scheduler-write-budget.py
      - name: Validar sintaxe e novo teste
        working-directory: onesignal-scheduler
        run: |
          node --check src/index.js
          node test/scheduler-write-budget.test.mjs
          npm test
      - name: Persistir otimização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onesignal-scheduler/src/index.js .github/workflows/deploy-worker-master-fix.yml
          if git diff --cached --quiet; then
            echo 'Otimização já aplicada.'
          else
            git commit -m "Otimizar orçamento de gravações do scheduler"
            git push
          fi
