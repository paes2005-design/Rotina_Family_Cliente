name: Rebuild tolerance scoring v2

on:
  push:
    paths:
      - '.github/triggers/rebuild-tolerance-scoring-v2.txt'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoring stabilization
        run: python scripts/stabilize_scoring_v3.py

      - name: Validate JavaScript syntax
        run: |
          node --check scoring-core.js
          node --check client-time-guard-v3.js
          node --check client-ui-pro.js

      - name: Commit stabilized client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client-time-guard-v3.js index-CLIENTE-v6.html client-ui-pro.js sw.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Stabilize scoring and tolerance rules"
          git push
