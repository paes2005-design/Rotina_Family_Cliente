name: Sprint 3 - corrigir push Participante com tela bloqueada
on:
  push:
    paths:
      - '.github/workflows/sprint3-fix-participant-locked-push.yml'
      - 'scripts/sprint3_fix_participant_locked_push_v2.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar migração
        run: python scripts/sprint3_fix_participant_locked_push_v2.py
      - name: Auditar alterações
        run: |
          node --check client-bootstrap-v1.js
          node --check runtime-build-info.js
          node --check sw.js
          grep -F "welcomeNotification: { disable: true }" index-CLIENTE-v6.html
          grep -F "garantirPushParticipante" index-CLIENTE-v6.html
          grep -F "push.onesignal_subscription_alterada" index-CLIENTE-v6.html
          grep -F "ROTINA_SW_VERSION='89'" sw.js
          grep -F "BUILD='20260915.4'" client-bootstrap-v1.js
      - name: Commitar runtime corrigido
        run: |
          git config user.name "paes2005-design"
          git config user.email "paes2005@gmail.com"
          git add index-CLIENTE-v6.html index.html client-bootstrap-v1.js runtime-build-info.js sw.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nenhuma mudança necessária"
            exit 0
          fi
          git commit -m "Sprint 3: corrige push do Participante com tela bloqueada"
          git push origin HEAD:main
