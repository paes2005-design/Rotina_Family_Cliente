name: Auditoria pós-deploy cache-first
# v3: valida somente módulos carregados em produção e erros posteriores à centralização.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-first-post-deploy-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: paes2005-design/Rotina_Family_ADM
          ref: main
          path: adm

      - name: Auditar módulos ativos sem listeners contínuos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          active_client=[
            'index-CLIENTE-v6.html','client-offline-execution-integrity-v1.js',
            'client-reviewed-points.js','client-execution-source-unifier-v1.js',
            'client-early-start-ui.js','client-tolerance-timer.js','client-week-nav.js',
            'family-alarm-client.js'
          ]
          active_adm=[
            'adm/index-ADMIN-v8.html','adm/reward-redemption-notifications.js',
            'adm/family-alarm-admin.js'
          ]
          for f in active_client + active_adm:
              s=Path(f).read_text(encoding='utf-8')
              assert 'onSnapshot(' not in s, f'Listener contínuo restante em módulo ativo: {f}'
          base=Path('index-CLIENTE-v6.html').read_text(encoding='utf-8')
          adm=Path('adm/index-ADMIN-v8.html').read_text(encoding='utf-8')
          assert 'const SINCRONIZACAO_CLIENTE_MS = 5 * 60 * 1000' in base
          assert 'const SINCRONIZACAO_ADM_MS = 5 * 60 * 1000' in adm
          assert "getDocsFromCache" in base and "getDocsFromServer" in base
          assert "getDocsFromCache" in adm and "getDocsFromServer" in adm
          print('MODULOS_ATIVOS_CACHE_FIRST=OK')
          PY

          echo '=== Inventário informativo de listeners em arquivos legados/dormantes ==='
          grep -RIn --include='*.js' --include='*.html' 'onSnapshot(' . \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=adm --exclude-dir=teste-regra-25 \
            --exclude='index-CLIENTE-v6.html' --exclude='client-offline-execution-integrity-v1.js' \
            --exclude='client-reviewed-points.js' --exclude='client-execution-source-unifier-v1.js' \
            --exclude='client-early-start-ui.js' --exclude='client-tolerance-timer.js' \
            --exclude='client-week-nav.js' --exclude='family-alarm-client.js' || true
          grep -RIn --include='*.js' --include='*.html' 'onSnapshot(' adm \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=teste-regra-25 \
            --exclude='index-ADMIN-v8.html' --exclude='reward-redemption-notifications.js' \
            --exclude='family-alarm-admin.js' || true

      - name: Confirmar versões e módulos no GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          C='https://paes2005-design.github.io/Rotina_Family_Cliente/'
          A='https://paes2005-design.github.io/Rotina_Family_ADM/'
          okc=0; oka=0
          for i in {1..40}; do
            curl -fsS "${C}index.html?audit=${GITHUB_RUN_ID}-${i}" -o /tmp/client-entry.html || true
            curl -fsS "${A}index.html?audit=${GITHUB_RUN_ID}-${i}" -o /tmp/adm-entry.html || true
            grep -q "20260827.3" /tmp/client-entry.html && okc=1 || true
            grep -q "20260827.2" /tmp/adm-entry.html && oka=1 || true
            if [ "$okc" = 1 ] && [ "$oka" = 1 ]; then break; fi
            sleep 3
          done
          test "$okc" = 1
          test "$oka" = 1

          client_files=(
            index-CLIENTE-v6.html client-offline-execution-integrity-v1.js
            client-reviewed-points.js client-execution-source-unifier-v1.js
            client-early-start-ui.js client-tolerance-timer.js client-week-nav.js
            family-alarm-client.js
          )
          for f in "${client_files[@]}"; do
            curl -fsS "${C}${f}?audit=${GITHUB_RUN_ID}" -o "/tmp/client-${f//\//_}"
            ! grep -q 'onSnapshot(' "/tmp/client-${f//\//_}"
          done
          adm_files=(index-ADMIN-v8.html reward-redemption-notifications.js family-alarm-admin.js)
          for f in "${adm_files[@]}"; do
            curl -fsS "${A}${f}?audit=${GITHUB_RUN_ID}" -o "/tmp/adm-${f//\//_}"
            ! grep -q 'onSnapshot(' "/tmp/adm-${f//\//_}"
          done
          grep -q 'SINCRONIZACAO_CLIENTE_MS = 5 \* 60 \* 1000' /tmp/client-index-CLIENTE-v6.html
          grep -q 'SINCRONIZACAO_ADM_MS = 5 \* 60 \* 1000' /tmp/adm-index-ADMIN-v8.html
          grep -q 'ALARM_SYNC_MS=5\*60\*1000' /tmp/client-family-alarm-client.js
          grep -q 'ALARM_SYNC_MS=5\*60\*1000' /tmp/adm-family-alarm-admin.js
          echo 'PAGES_CACHE_FIRST_V2=OK'

      - name: Auditar Worker e erros posteriores à migração
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev'
          TOKEN="cache-first-v2-audit-${GITHUB_RUN_ID}"
          CUTOFF='2026-08-27T15:20:00.000Z'
          curl -fsS "$BASE/monitoramento?audit=$TOKEN" -o /tmp/monitor.json
          curl -fsS "$BASE/diagnostico-tecnico?limit=120&audit=$TOKEN" -o /tmp/diag.json
          curl -fsS "$BASE/diagnostico-worker?audit=$TOKEN" -o /tmp/worker.json

          echo '=== MONITORAMENTO ==='; cat /tmp/monitor.json
          echo; echo '=== DIAGNÓSTICO RECENTE ==='
          CUTOFF="$CUTOFF" node - <<'NODE'
          const d=require('/tmp/diag.json');
          const cutoff=Date.parse(process.env.CUTOFF);
          const recent=(d.logs||[]).filter(x=>Date.parse(x.clienteEm||'')>=cutoff);
          const bad400=recent.filter(x=>x.evento==='rede.http_erro'&&Number(x.detalhes?.status)===400);
          const bad429=recent.filter(x=>Number(x.detalhes?.status)===429||/429/.test(x.evento||''));
          const errors=recent.filter(x=>x.nivel==='error');
          const slow=recent.filter(x=>x.evento==='operacao.lenta');
          console.log(JSON.stringify({storage:d.storage,status:d.status,lastRunAt:d.lastRunAt,cutoff:new Date(cutoff).toISOString(),recentCount:recent.length,http400:bad400.length,http429:bad429.length,errors:errors.length,slowOperations:slow.length,recent:recent.slice(0,20)},null,2));
          if(d.storage!=='cloudflare-do'||d.technicalStoreVersion!==1)process.exit(1);
          if(bad400.length||bad429.length||errors.length)process.exit(2);
          NODE

          echo '=== DIAGNÓSTICO WORKER ==='; cat /tmp/worker.json
          node - <<'NODE'
          const m=require('/tmp/monitor.json'),w=require('/tmp/worker.json');
          if(m.storage!=='cloudflare-do'||m.technicalStoreVersion!==1)process.exit(1);
          if(m.status==='DEGRADADO'||m.status==='ERRO_MONITORAMENTO_TECNICO')process.exit(2);
          if(Number(w.alarms?.withError||0)>0||Number(w.rewardAdmin?.withError||0)>0||Number(w.rewardClient?.withError||0)>0)process.exit(3);
          NODE
          echo 'AUDITORIA_CACHE_FIRST_PRODUCAO=OK'
