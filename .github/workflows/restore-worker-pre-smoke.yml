name: Restaurar Worker pré-smoke

on:
  push:
    branches:
      - teste-arvore-comercial-segura-2026-08-20
    paths:
      - .github/workflows/restore-worker-pre-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onesignal-scheduler
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Restore exact version active before smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions deploy 8ed3c8cd-02e0-46aa-b29c-2de0282cde31@100% -y
          npx wrangler deployments status --json
