name: Build Native Alarm POC
on:
  push:
    branches: [test/sprint3-native-alarm-build]
    paths:
      - 'experiments/native-alarm-poc/**'
      - '.github/workflows/build-native-alarm-poc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/native-alarm-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools"
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rotina-Family-Alarm-Test
          path: experiments/native-alarm-poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
