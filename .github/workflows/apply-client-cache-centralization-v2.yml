name: Centralizar leitores ativos do Cliente no cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-client-cache-centralization-v2.yml'
      - 'scripts/hotfix-client-initial-sync-20260827.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar hotfix de sincronização inicial
        run: python scripts/hotfix-client-initial-sync-20260827.py
      - name: Validar JavaScript
        run: |
          node --check client-early-start-ui.js
          node --check client-tolerance-timer.js
          node --check client-week-nav.js
          node --check client-ui-pro.js
          node --check sw.js
      - name: Persistir
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-CLIENTE-v6.html index.html sw.js
          if git diff --cached --quiet; then echo 'Já aplicado.'; else git commit -m "Corrigir sincronização imediata ao entrar no Cliente" && git push origin main; fi
