name: Locate commercial migration error

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-stack-commercial-migration.yml'

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add stack location to temporary diagnostic
        shell: python
        run: |
          from pathlib import Path
          p=Path('onesignal-scheduler/src/master-rate-limit-production-entry.js')
          s=p.read_text(encoding='utf-8')
          old="return Response.json({ ok:false, error:String(error?.message || error).replace(/\\s+/g,' ').slice(0,320) }, { headers: { 'cache-control': 'no-store' } });"
          new="return Response.json({ ok:false, error:String(error?.message || error).replace(/\\s+/g,' ').slice(0,320), stack:String(error?.stack || '').split('\\n').slice(0,6).join(' | ').slice(0,900) }, { headers: { 'cache-control': 'no-store' } });"
          if old not in s and "stack:String(error?.stack" not in s:
              raise SystemExit('Diagnostic marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Validate and deploy
        working-directory: onesignal-scheduler
        run: |
          npm ci
          node --check src/master-rate-limit-production-entry.js
          npm test
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onesignal-scheduler/src/master-rate-limit-production-entry.js
          git diff --cached --quiet || git commit -m "Expose migration error location temporarily"
          git push origin main

      - name: Read stack location
        run: curl --silent --show-error -X POST 'https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/security/run-commercial-migration-once'
