name: Sprint 2.0 - single sync owner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/fix-single-sync-owner-20260915.txt'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply central sync owner migration
        run: python scripts/fix-single-sync-owner-20260915.py

      - name: Static audit
        shell: bash
        run: |
          set -euo pipefail
          node --check client-sync-scheduler-v1.js
          ! grep -F "sincronizarDadosCliente('intervalo-5min',true)" index-CLIENTE-v6.html
          ! grep -F "sincronizarDadosCliente('retorno-visivel-stale',true)" index-CLIENTE-v6.html
          ! grep -F "sincronizarDadosCliente('reconectado-stale',true)" index-CLIENTE-v6.html
          ! grep -F "sync.cliente_ciclo" index-CLIENTE-v6.html
          grep -F "PARTICIPANT_SYNC_SCHEDULER_VERSION=2" client-sync-scheduler-v1.js
          grep -F "owner-central-unico-cache-first-sem-historico-hot-sync" client-sync-scheduler-v1.js
          grep -F "rotinaParticipantApplyStoreToLegacy" index-CLIENTE-v6.html
          grep -F "20260915.1" index.html
          grep -F "ROTINA_SW_VERSION='86'" sw.js

      - name: Commit production change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'paes2005-design'
          git config user.email 'paes2005@gmail.com'
          git add index-CLIENTE-v6.html client-sync-scheduler-v1.js client-bootstrap-v1.js index.html runtime-build-info.js sw.js
          git commit -m 'Sprint 2.0: centraliza sincronização do participante'
          git push origin HEAD:main
