name: Apply daily Client panels test patch
on:
  push:
    branches: ['test/daily-client-panels-v1']
    paths: ['patch-daily-client-panels.mjs']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/daily-client-panels-v1
      - name: Apply patch
        run: node patch-daily-client-panels.mjs
      - name: Commit patched app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-CLIENTE-v6.html
          git commit -m 'Show only today justifications and redemptions in Client'
          git push origin HEAD:test/daily-client-panels-v1
