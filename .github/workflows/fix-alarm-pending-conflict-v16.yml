name: Fix alarm pending conflict v16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-alarm-pending-conflict-v16.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile pending participant alarm mutations with ADM ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('family-alarm-client.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const ALARM_RUNTIME_VERSION=15;', 'const ALARM_RUNTIME_VERSION=16;', 1)
          marker="ler(KEY_PENDING,[]).filter(a=>a.grupoId===g&&a.perfilId===p&&naSemanaAtual(a)).forEach(a=>{pendentes[a.tarefaId]=a});"
          replacement="""let filaPendente=ler(KEY_PENDING,[]).filter(a=>a.grupoId===g&&a.perfilId===p&&naSemanaAtual(a));
  const origemServidor=/server|servidor/i.test(String(origem||''));
  if(origemServidor&&filaPendente.length){
    const mantidos=[];
    for(const local of filaPendente){
      const remoto=remotos[local.tarefaId];
      if(remoto&&travado(remoto)){
        logAlarme('alarme.config_conflito_adm_resolvido',{tarefaId:local.tarefaId,acao:'descartar-mutacao-local',origemRemota:remoto.origem||'',bloqueado:remoto.bloqueado===true});
        continue;
      }
      const remotoAtualizado=Date.parse(remoto?.atualizadoEm||remoto?.schedulerSolicitadoEm||'')||0;
      const localAtualizado=Date.parse(local?.atualizadoEm||local?.schedulerSolicitadoEm||'')||0;
      const mesmoEstado=!!remoto&&remoto.ativo===local.ativo&&remoto.origem===local.origem&&remoto.bloqueado===local.bloqueado;
      if(mesmoEstado&&remotoAtualizado>=localAtualizado){
        logAlarme('alarme.config_confirmada_servidor',{tarefaId:local.tarefaId,ativo:local.ativo===true});
        continue;
      }
      mantidos.push(local);
    }
    if(mantidos.length!==filaPendente.length)salvar(KEY_PENDING,mantidos);
    filaPendente=mantidos;
  }
  filaPendente.forEach(a=>{pendentes[a.tarefaId]=a});"""
          if marker not in s:
              raise SystemExit('Pending marker not found')
          s=s.replace(marker,replacement,1)
          duplicate="  const origemServidor=/server|servidor/i.test(String(origem||''));\n  const origemServidor=/server|servidor/i.test(String(origem||''));"
          s=s.replace(duplicate,"  const origemServidor=/server|servidor/i.test(String(origem||''));",1)
          p.write_text(s,encoding='utf-8')
          p=Path('client-bootstrap-v1.js')
          s=p.read_text(encoding='utf-8').replace("const BUILD='20260910.4';","const BUILD='20260910.5';",1).replace("src:'./family-alarm-client.js?v=15'","src:'./family-alarm-client.js?v=16'",1)
          p.write_text(s,encoding='utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace("const BUILD='20260910.4';","const BUILD='20260910.5';",1).replace('client-bootstrap-v1.js?v=20260910.4','client-bootstrap-v1.js?v=20260910.5').replace("release:'sprint2.1-alarm-persistent-store-v2'","release:'sprint2.1-alarm-owner-reconciliation-v16'").replace('alarmRuntime:15','alarmRuntime:16')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check family-alarm-client.js
          node --check client-bootstrap-v1.js
          grep -q "ALARM_RUNTIME_VERSION=16" family-alarm-client.js
          grep -q "config_conflito_adm_resolvido" family-alarm-client.js
          grep -q "20260910.5" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-alarm-client.js client-bootstrap-v1.js index.html
          git commit -m "fix: reconcile participant alarm pending state with ADM ownership"
          git push
