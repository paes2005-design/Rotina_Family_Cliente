name: Sprint 2.1 - corrigir push do Participante

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sprint2-fix-participant-push-v1.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: python scripts/sprint2_fix_participant_push_v1.py

      - name: Verificar sintaxe e contrato
        run: |
          set -euo pipefail
          node --check family-alarm-client.js
          node --check client-bootstrap-v1.js
          node --check sw.js
          node --check onesignal-scheduler/src/index.js
          node --check onesignal-scheduler/test/integration.test.mjs
          grep -q "family-alarm-client.js?v=12" client-bootstrap-v1.js
          grep -q "const ROTINA_SW_VERSION='80'" sw.js
          grep -q "const ROTINA_BUILD_ID='20260908.1'" sw.js
          grep -q 'include_aliases' onesignal-scheduler/src/index.js
          grep -q 'participantExternalId' onesignal-scheduler/src/index.js
          ! grep -q 'clientPushFilters' onesignal-scheduler/src/index.js
          grep -q 'pushAtivo' family-alarm-client.js
          grep -q 'OneSignal.login(externalId)' index-CLIENTE-v6.html

      - name: Rodar regressões do scheduler
        working-directory: onesignal-scheduler
        run: |
          npm ci
          npm run check
          npm test

      - name: Commit da correção
        run: |
          set -euo pipefail
          sed -i 's/[[:space:]]\+$//' docs/SPRINT2_1_BLOCO1_BOOTSTRAP.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-CLIENTE-v6.html family-alarm-client.js client-bootstrap-v1.js index.html sw.js docs/SPRINT2_1_BLOCO1_BOOTSTRAP.md onesignal-scheduler/src/index.js onesignal-scheduler/test/integration.test.mjs .github/workflows/family-alarm-audit.yml
          git diff --cached --check
          git commit -m 'Sprint 2.1: corrigir push em segundo plano do Participante build 20260908.1'
          git push origin HEAD:main
