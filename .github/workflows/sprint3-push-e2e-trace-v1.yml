name: sprint3-push-e2e-trace-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sprint3-push-e2e-trace-v1.yml'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply trace
        run: python scripts/sprint3_push_e2e_trace_v1.py
      - name: Validate
        run: |
          node --check onesignal-scheduler/src/index.js
          grep -q 'push.onesignal_envio_aceito' onesignal-scheduler/src/index.js
          grep -q 'targetExternalId' onesignal-scheduler/src/index.js
          grep -q 'recipients: Number(body.recipients' onesignal-scheduler/src/index.js
      - name: Test scheduler
        working-directory: onesignal-scheduler
        run: |
          npm ci
          npm run check
          npm test
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add onesignal-scheduler/src/index.js
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sprint 3: rastrear envio E2E do push de alarme'
          git push origin HEAD:main
