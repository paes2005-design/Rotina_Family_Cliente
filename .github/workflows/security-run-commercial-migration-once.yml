name: Run commercial migration once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-run-commercial-migration-once.yml'

permissions:
  contents: write

jobs:
  patch-deploy-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add one-time fixed maintenance route
        shell: python
        run: |
          from pathlib import Path
          p=Path('onesignal-scheduler/src/master-rate-limit-production-entry.js')
          s=p.read_text(encoding='utf-8')
          needle="""      if (url.pathname === '/security/commercial-migration-ready' && request.method === 'GET') {\n        const audit = await auditCommercialMigration(env);\n        return Response.json(audit, { headers: { 'cache-control': 'no-store' } });\n      }"""
          extra=needle+"""\n      if (url.pathname === '/security/run-commercial-migration-once' && request.method === 'POST') {\n        const maintenance = await runSecurityMaintenance(env);\n        const audit = await auditCommercialMigration(env);\n        return Response.json({ maintenance, audit }, { headers: { 'cache-control': 'no-store' } });\n      }"""
          if "'/security/run-commercial-migration-once'" not in s:
              if needle not in s: raise SystemExit('Audit route marker not found')
              s=s.replace(needle,extra,1)
              p.write_text(s,encoding='utf-8')

      - name: Validate Worker
        working-directory: onesignal-scheduler
        run: |
          npm ci
          node --check src/master-rate-limit-production-entry.js
          npm test
          npx wrangler deploy --dry-run

      - name: Commit one-time route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onesignal-scheduler/src/master-rate-limit-production-entry.js
          git diff --cached --quiet || git commit -m "Add one-time commercial migration execution route"
          git push origin main

      - name: Deploy Worker
        working-directory: onesignal-scheduler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Execute migration and require clean result
        shell: bash
        run: |
          set -euo pipefail
          URL='https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/security/run-commercial-migration-once'
          BODY="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 -X POST "$URL")"
          echo "Migration execution: $BODY"
          python3 - "$BODY" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          audit=data.get('audit') or {}
          assert audit.get('ready') is True, data
          assert int(audit.get('remainingLegacy',-1)) == 0, data
          assert audit.get('markerComplete') is True, data
          print('COMMERCIAL MIGRATION EXECUTED AND CLEAN')
          PY
