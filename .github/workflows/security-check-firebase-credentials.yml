name: Check Firebase deployment credentials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-check-firebase-credentials.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report credential availability only
        env:
          HAS_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
          HAS_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
          HAS_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          HAS_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
          HAS_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
          HAS_FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS != '' }}
        run: |
          echo "FIREBASE_TOKEN=$HAS_FIREBASE_TOKEN"
          echo "GOOGLE_SERVICE_ACCOUNT_JSON=$HAS_GOOGLE_SERVICE_ACCOUNT_JSON"
          echo "FIREBASE_SERVICE_ACCOUNT=$HAS_FIREBASE_SERVICE_ACCOUNT"
          echo "GCP_SA_KEY=$HAS_GCP_SA_KEY"
          echo "GOOGLE_CREDENTIALS=$HAS_GOOGLE_CREDENTIALS"
          echo "FIREBASE_CREDENTIALS=$HAS_FIREBASE_CREDENTIALS"
