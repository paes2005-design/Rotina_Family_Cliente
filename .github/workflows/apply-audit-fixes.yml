name: Apply Client visible time fix
on:
  push:
    paths:
      - '.github/workflows/apply-audit-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visible 59-second end boundary and cache refresh
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n!=expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {n}')
              p.write_text(s.replace(old,new,expected),encoding='utf-8')

          replace_exact(
              'index-CLIENTE-v6.html',
              "        function renderizarTarefasHoje(){",
              "        function horaSugeridaComSegundos(valor,fim=false){\n            const s=String(valor||'').trim();\n            if(/^\\d{1,2}:\\d{2}:\\d{2}$/.test(s)) return s;\n            if(/^\\d{1,2}:\\d{2}$/.test(s)) return `${s}:${fim?'59':'00'}`;\n            return s;\n        }\n\n        function renderizarTarefasHoje(){"
          )
          replace_exact(
              'index-CLIENTE-v6.html',
              "                let horario=`<div class=\"horario-container\"><span class=\"horario-sugerido\">⏰ ${escaparHtml(dados.horaSugeridaInicio)} - ${escaparHtml(dados.horaSugeridaFim)}</span>`;",
              "                let horario=`<div class=\"horario-container\"><span class=\"horario-sugerido\">⏰ ${escaparHtml(horaSugeridaComSegundos(dados.horaSugeridaInicio,false))} - ${escaparHtml(horaSugeridaComSegundos(dados.horaSugeridaFim,true))}</span>`;"
          )
          replace_exact(
              'index-CLIENTE-v6.html',
              '    <script src="./client-ui-pro.js"></script>',
              '    <script src="./client-ui-pro.js?v=24"></script>'
          )
          replace_exact(
              'index-CLIENTE-v6.html',
              "          navigator.serviceWorker.register('./sw.js')",
              "          navigator.serviceWorker.register('./sw.js?v=24')"
          )
          replace_exact(
              'sw.js',
              "const CACHE_NAME='rotina-family-cliente-v23';",
              "const CACHE_NAME='rotina-family-cliente-v24';"
          )
          PY
      - name: Verify visible rule
        run: |
          grep -F "horaSugeridaComSegundos(dados.horaSugeridaFim,true)" index-CLIENTE-v6.html
          grep -F "client-ui-pro.js?v=24" index-CLIENTE-v6.html
          grep -F "sw.js?v=24" index-CLIENTE-v6.html
          grep -F "rotina-family-cliente-v24" sw.js
          grep -F "campoHMS(t.horaSugeridaFim,'59')" client-tolerance-timer.js
          grep -F "limiteFim=aposMinutoSugerido(j.fim)" tolerance-timer-core.js
          node --check client-ui-pro.js
          node --check client-tolerance-timer.js
          node --check tolerance-timer-core.js
          node --check scoring-core.js
          node --check sw.js
      - name: Commit visible fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-CLIENTE-v6.html sw.js
          git commit -m "Render suggested end at 59 seconds and refresh Client cache"
          git push
