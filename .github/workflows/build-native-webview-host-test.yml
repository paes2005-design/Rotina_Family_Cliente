name: Build Native WebView Host Test
# trigger build 2026-09-19
on:
  push:
    branches: [test/sprint3-webview-native-host]
    paths: ['experiments/native-webview-host/**','.github/workflows/build-native-webview-host-test.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: experiments/native-webview-host}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: {name: Rotina-Family-Native-Host-Test, path: experiments/native-webview-host/app/build/outputs/apk/debug/app-debug.apk}
