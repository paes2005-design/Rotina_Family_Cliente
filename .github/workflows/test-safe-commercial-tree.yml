name: Teste comercial seguro

on:
  push:
    branches:
      - teste-arvore-comercial-segura-2026-08-20
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onesignal-scheduler
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Existing regression suite
        run: npm run check && npm test
      - name: Commercial group-only policy tests
        run: node test/commercial-safety.test.mjs
      - name: Syntax check safe modules
        run: |
          node --check src/commercial-policy.js
          node --check src/commercial-safe-entry.js
          node --check src/commercial-preview-entry.js
          node --check src/master-user-actions-fallback.js
          node --check src/master-user-actions-preview.js
          node --check src/master-group-summary.js
          node --check src/master-rate-limit-entry.js
          node --check src/test-console.js
      - name: Architecture invariants
        shell: python
        run: |
          from pathlib import Path
          import re

          safe = Path('src/commercial-safe-entry.js').read_text(encoding='utf-8')
          preview = Path('src/commercial-preview-entry.js').read_text(encoding='utf-8')
          policy = Path('src/commercial-policy.js').read_text(encoding='utf-8')
          entry = Path('src/master-rate-limit-entry.js').read_text(encoding='utf-8')
          summary = Path('src/master-group-summary.js').read_text(encoding='utf-8')
          client = Path('../commercial-access-client.js').read_text(encoding='utf-8')
          wrangler = Path('wrangler.jsonc').read_text(encoding='utf-8')

          assert "import app from './commercial-preview-entry.js'" in entry
          assert "handleMasterGroupSummary" in entry
          assert "'/admin-master/group'" in entry
          assert 'mustMutateFirebaseAuthForFamilyBlock' in policy
          assert 'return false' in policy.split('mustMutateFirebaseAuthForFamilyBlock',1)[1]

          master = re.search(r'async function requireMasterSafe\(.*?\n\}', safe, re.S)
          assert master, 'requireMasterSafe ausente'
          assert 'adminByUid' not in master.group(0), 'Master voltou a depender de administradores'
          assert 'isMasterEmail' in master.group(0)

          group = re.search(r"if \(request.method === 'POST' && url.pathname.endsWith\('/groups'\)\) \{.*?\n  \}", safe, re.S)
          assert group, 'rota /groups ausente'
          text = group.group(0)
          for forbidden in ['disableUser', "'/accounts:update'", 'setGroupDisabled']:
              assert forbidden not in text, f'Bloqueio familiar toca Auth: {forbidden}'
          assert 'familyBlockPatch' in text
          assert 'upsertConfig' in text

          # Fase atual: decisão comercial é SOMENTE configGrupos/<grupoId>.grupoBloqueado.
          assert "config.grupoBloqueado === true" in policy
          assert 'individualBlocked' not in policy
          assert 'profileBlocked' not in policy
          assert 'teste-expirado' not in policy
          assert "doc(db(), 'configGrupos', group)" in client
          assert "'perfis'" not in client
          assert 'desativadoMaster' not in client

          # Consulta do Master é UM grupo por vez e identifica somente tipoAcesso=proprietario como responsável.
          assert "queryByString(env, 'administradores', 'grupoId', groupId" in summary
          assert "queryByString(env, 'administradores', 'codigoCliente', groupId" in summary
          assert "queryByString(env, 'perfis', 'grupoId', groupId" in summary
          assert "tipoAcesso || '') === 'proprietario'" in summary
          assert 'administradorPrincipal' in summary
          assert "listDocs(env, 'administradores'" not in summary

          assert 'COMMERCIAL_TEST_DRY_RUN' in preview
          assert '"preview_urls": true' in wrangler
          assert '"COMMERCIAL_TEST_DRY_RUN": "1"' in wrangler
          for secret in ['MASTER_ADMIN_EMAILS','GOOGLE_SERVICE_ACCOUNT_JSON','APP_LOG_ENCRYPTION_KEY','ONESIGNAL_REST_API_KEY']:
              assert secret in wrangler, f'Secret obrigatório não declarado: {secret}'

          print('Arquitetura comercial segura — grupo único + proprietário: OK')
      - name: Dry-run bundle validation
        run: npx wrangler versions upload --dry-run

  preview-upload:
    needs: safety-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onesignal-scheduler
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Upload preview version only
        run: npx wrangler versions upload --preview-alias safe-commercial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check preview routing or Access protection
        shell: python
        run: |
          import json, urllib.error, urllib.request
          url = 'https://safe-commercial-rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/preview-health'
          try:
              with urllib.request.urlopen(url, timeout=15) as response:
                  body = json.loads(response.read().decode('utf-8'))
              assert body.get('preview') is True, body
              assert body.get('dryRun') is True, body
              print('Preview público respondeu em dry-run: OK')
          except urllib.error.HTTPError as error:
              if error.code != 403:
                  raise
              print('Preview protegido por Cloudflare Access (HTTP 403): OK')
      - name: Confirm no production deployment
        run: echo "Preview version validated. Production deployment was not changed."
