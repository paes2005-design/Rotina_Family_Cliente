name: Teste comercial seguro

on:
  push:
    branches:
      - teste-arvore-comercial-segura-2026-08-20
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onesignal-scheduler
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Existing regression suite
        run: npm run check && npm test
      - name: Commercial group-only policy tests
        run: node test/commercial-safety.test.mjs
      - name: Syntax check safe modules
        run: |
          node --check src/commercial-policy.js
          node --check src/commercial-safe-entry.js
          node --check src/commercial-preview-entry.js
          node --check src/master-groups-index.js
          node --check src/master-group-summary.js
          node --check src/master-rate-limit-entry.js
          node --check src/test-console.js
      - name: Architecture invariants
        shell: python
        run: |
          from pathlib import Path
          import re
          safe=Path('src/commercial-safe-entry.js').read_text(encoding='utf-8')
          preview=Path('src/commercial-preview-entry.js').read_text(encoding='utf-8')
          policy=Path('src/commercial-policy.js').read_text(encoding='utf-8')
          entry=Path('src/master-rate-limit-entry.js').read_text(encoding='utf-8')
          index=Path('src/master-groups-index.js').read_text(encoding='utf-8')
          summary=Path('src/master-group-summary.js').read_text(encoding='utf-8')
          console=Path('src/test-console.js').read_text(encoding='utf-8')
          client=Path('../commercial-access-client.js').read_text(encoding='utf-8')
          wrangler=Path('wrangler.jsonc').read_text(encoding='utf-8')

          assert "import app from './commercial-preview-entry.js'" in entry
          assert 'handleMasterGroupsIndex' in entry and 'handleMasterGroupSummary' in entry
          master=re.search(r'async function requireMasterSafe\(.*?\n\}', safe, re.S)
          assert master and 'adminByUid' not in master.group(0) and 'isMasterEmail' in master.group(0)
          assert "config.grupoBloqueado === true" in policy
          assert 'individualBlocked' not in policy and 'profileBlocked' not in policy
          assert "doc(db(), 'configGrupos', group)" in client and "'perfis'" not in client

          assert "collectionId: 'administradores'" in index
          assert "data.codigoCliente || data.grupoId" in index
          assert 'chooseOwner' in index and 'isMasterEmail(env, email)' in index

          assert "queryByString(env, 'administradores', 'codigoCliente', groupId" in summary
          assert "queryByString(env, 'perfis', 'grupoId', groupId" in summary
          assert 'export async function loadMasterGroupSummaryData' in summary
          assert "safeRead('Administradores'" in summary
          assert "safeRead('Integrantes'" in summary
          assert "safeRead('Estado comercial'" in summary
          assert 'status: 200' in summary

          assert "const MASTER_EMAIL = 'paes2005@gmail.com'" in console
          assert "api('/admin-master/groups')" in console
          assert '/admin-master/group?grupoId=' in console
          assert 'Todos os grupos' in console
          assert "/admin-master/users" not in console and "/admin-master/tree" not in console

          assert "url.pathname === '/preview-selftest/group'" in preview
          assert 'selfTestVersion: 2' in preview
          assert 'loadMasterGroupSummaryData' in preview
          assert 'administratorCount' in preview and 'clientCount' in preview
          assert '"COMMERCIAL_TEST_DRY_RUN": "1"' in wrangler
          for secret in ['MASTER_ADMIN_EMAILS','GOOGLE_SERVICE_ACCOUNT_JSON','APP_LOG_ENCRYPTION_KEY','ONESIGNAL_REST_API_KEY']:
              assert secret in wrangler
          print('Safety gate: OK')
      - name: Dry-run bundle validation
        run: npx wrangler versions upload --dry-run

  preview-upload:
    needs: safety-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version_id: ${{ steps.version.outputs.version_id }}
    defaults:
      run:
        working-directory: onesignal-scheduler
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Upload preview version only
        run: npx wrangler versions upload --preview-alias safe-commercial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-output.ndjson
      - name: Capture uploaded version id
        id: version
        shell: python
        run: |
          import json,os
          rows=[]
          for line in open('/tmp/wrangler-output.ndjson',encoding='utf-8'):
              try: rows.append(json.loads(line))
              except Exception: pass
          candidates=[r for r in rows if r.get('type')=='version-upload' and r.get('version_id')]
          if not candidates: raise SystemExit('Version ID não encontrado')
          vid=candidates[-1]['version_id']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out: out.write(f'version_id={vid}\n')
          print('TEST_VERSION_ID='+vid)
      - name: Confirm preview is protected or reachable
        shell: python
        run: |
          import json,urllib.error,urllib.request
          url='https://safe-commercial-rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/preview-health'
          try:
              with urllib.request.urlopen(url,timeout=15) as r: b=json.loads(r.read())
              assert b.get('preview') is True and b.get('dryRun') is True
              print('Preview reachable: OK')
          except urllib.error.HTTPError as e:
              assert e.code==403
              print('Preview protected by Access: OK')

  live-group-smoke:
    needs: [safety-gate, preview-upload]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onesignal-scheduler
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_VERSION_ID: ${{ needs.preview-upload.outputs.version_id }}
      BASE_VERSION_ID: 8ed3c8cd-02e0-46aa-b29c-2de0282cde31
      WORKER_NAME: rotina-family-onesignal-scheduler
      PROD_URL: https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev
      TEST_GROUP_ID: CLI-6143
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Restore exact pre-smoke baseline first
        run: npx wrangler versions deploy "$BASE_VERSION_ID@100%" -y
      - name: Real group smoke test at zero normal traffic
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEST_VERSION_ID"
          restore() {
            echo 'Restoring baseline 100%...'
            npx wrangler versions deploy "$BASE_VERSION_ID@100%" -y >/tmp/restore.log 2>&1 || { cat /tmp/restore.log; return 1; }
          }
          trap restore EXIT

          echo 'Deploying test version at 0%, baseline at 100%...'
          npx wrangler versions deploy "$TEST_VERSION_ID@0%" "$BASE_VERSION_ID@100%" -y
          sleep 8
          OVERRIDE="${WORKER_NAME}=\"${TEST_VERSION_ID}\""

          echo 'Calling exact self-test route on the 0% version...'
          curl --fail-with-body --silent --show-error --max-time 35 \
            -D /tmp/selftest.headers \
            "$PROD_URL/preview-selftest/group?grupoId=$TEST_GROUP_ID" \
            -H "Cloudflare-Workers-Version-Overrides: $OVERRIDE" \
            -o /tmp/selftest.json
          cat /tmp/selftest.headers
          cat /tmp/selftest.json

          python - <<'PY'
          import json
          body=json.load(open('/tmp/selftest.json',encoding='utf-8'))
          assert body.get('selfTestVersion')==2, f'Override não atingiu a rota nova: {body}'
          assert body.get('ok') is True, body
          assert body.get('groupId')=='CLI-6143', body
          assert body.get('principalFound') is True, body
          assert int(body.get('administratorCount',0)) >= 1, body
          print('REAL_GROUP_ROUTE_OK', json.dumps(body, ensure_ascii=False))
          PY

          restore
          trap - EXIT
          echo 'SMOKE REAL OK; baseline restored.'
