name: Teste comercial seguro

on:
  push:
    branches:
      - teste-arvore-comercial-segura-2026-08-20
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onesignal-scheduler
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Existing regression suite
        run: npm run check && npm test
      - name: Commercial policy tests
        run: node test/commercial-safety.test.mjs
      - name: Syntax check production and preview modules
        run: |
          node --check src/commercial-policy.js
          node --check src/commercial-safe-v2-entry.js
          node --check src/commercial-preview-entry.js
          node --check src/master-groups-index.js
          node --check src/master-group-summary.js
          node --check src/master-rate-limit-production-entry.js
          node --check src/master-rate-limit-entry.js
          node --check src/master-logs-fallback.js
          node --check src/test-console.js
          node --check ../commercial-access-client.js
          node --check ../client-reviewed-points.js
      - name: Architecture invariants
        shell: python
        run: |
          from pathlib import Path
          policy=Path('src/commercial-policy.js').read_text(encoding='utf-8')
          safe=Path('src/commercial-safe-v2-entry.js').read_text(encoding='utf-8')
          preview=Path('src/commercial-preview-entry.js').read_text(encoding='utf-8')
          prod=Path('src/master-rate-limit-production-entry.js').read_text(encoding='utf-8')
          preview_entry=Path('src/master-rate-limit-entry.js').read_text(encoding='utf-8')
          index=Path('src/master-groups-index.js').read_text(encoding='utf-8')
          summary=Path('src/master-group-summary.js').read_text(encoding='utf-8')
          console=Path('src/test-console.js').read_text(encoding='utf-8')
          client=Path('../commercial-access-client.js').read_text(encoding='utf-8')
          reviewed=Path('../client-reviewed-points.js').read_text(encoding='utf-8')
          wrangler=Path('wrangler.jsonc').read_text(encoding='utf-8')

          # Política comercial v2: grupo único, 15 dias, Master protegido e sem Firebase Auth.
          assert 'COMMERCIAL_TRIAL_VERSION = 2' in policy
          assert 'COMMERCIAL_TRIAL_DAYS = 15' in policy
          assert "'teste-expirado'" in policy
          assert 'startFamilyTrialPatch' in policy and 'confirmFamilyPatch' in policy
          assert 'mustMutateFirebaseAuthForFamilyBlock' in policy
          assert "return false" in policy[policy.index('mustMutateFirebaseAuthForFamilyBlock'):]
          assert 'IDENTITY_TOOLKIT' not in safe
          assert 'disableUser' not in safe
          assert 'Firebase Authentication' not in safe
          assert "body.action === 'set-group-blocked'" in safe
          assert "body.action === 'confirm-group'" in safe
          assert "url.pathname === '/commercial/trial'" in safe
          assert 'owner?.data?.criadoEm' in safe or 'owner?.createTime' in safe
          assert 'commercialStorageSelfTest' in safe
          assert "url.pathname === '/admin-master/tree'" in safe and 'status: 410' in safe

          # Acesso Cliente aplica bloqueio manual e expiração v2, sem bloquear por falha técnica.
          assert "state === 'teste-expirado'" in client
          assert "state === 'bloqueado'" in client
          assert "Number(config.trialVersao || 0) === 2" in client
          assert "doc(db(), 'configGrupos', group)" in client
          assert "'perfis'" not in client
          assert 'acesso preservado' in client

          # Entrada de produção é distinta do preview e usa somente os módulos seguros.
          assert "import app from './commercial-safe-v2-entry.js'" in prod
          assert 'handleMasterGroupsIndex' in prod and 'handleMasterGroupSummary' in prod
          assert 'handleMasterLogsFallback' in prod and 'handleMasterUsersFallback' in prod
          assert 'responseCache.clear()' in prod
          assert 'commercial-preview-entry' not in prod
          assert 'master-user-actions-preview' not in prod
          assert '/admin-master/tree' not in prod
          assert "import app from './commercial-preview-entry.js'" in preview_entry

          # Índice de grupos: proprietário explícito + compatibilidade legado, nunca Master.
          assert "collectionId: 'administradores'" in index
          assert "data.codigoCliente || data.grupoId" in index
          assert 'chooseOwner' in index and 'isMasterEmail(env, email)' in index

          # Detalhe de um grupo por vez, com estado comercial completo.
          assert "queryByString(env, 'administradores', 'codigoCliente', groupId" in summary
          assert "queryByString(env, 'perfis', 'grupoId', groupId" in summary
          assert 'export async function loadMasterGroupSummaryData' in summary
          assert "safeRead('Administradores'" in summary
          assert "safeRead('Integrantes'" in summary
          assert "safeRead('Estado comercial'" in summary
          assert 'estado: commercialState' in summary
          assert 'trialFimEm' in summary and 'grupoConfirmado' in summary
          assert 'status: 200' in summary

          # Revisão de pontos permanece individualizada por tarefaId.
          assert 'familyTaskId' in reviewed
          assert "String(h.tarefaId||'')===tarefaId" in reviewed
          compact=''.join(reviewed.split())
          assert '||candidatos[0]||null' not in compact
          assert 'candidatos.length===1' in compact

          # Preview testa leitura real e transições comerciais em documento descartável.
          assert "url.pathname === '/preview-selftest/group'" in preview
          assert "url.pathname === '/preview-selftest/commercial-storage'" in preview
          assert 'commercialStorageSelfTest' in preview
          assert "url.pathname === '/preview-selftest/score-review'" in preview
          assert "const MASTER_EMAIL = 'paes2005@gmail.com'" in console
          assert "api('/admin-master/groups')" in console
          assert '/admin-master/group?grupoId=' in console
          assert 'Todos os grupos' in console
          assert "/admin-master/users" not in console and "/admin-master/tree" not in console
          assert '"COMMERCIAL_TEST_DRY_RUN": "1"' in wrangler
          for secret in ['MASTER_ADMIN_EMAILS','GOOGLE_SERVICE_ACCOUNT_JSON','APP_LOG_ENCRYPTION_KEY','ONESIGNAL_REST_API_KEY']:
              assert secret in wrangler
          print('Safety gate: produção v2 + grupos + logs + trial 15d + task-id OK')
      - name: Dry-run bundle validation
        run: npx wrangler versions upload --dry-run

  preview-upload:
    needs: safety-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version_id: ${{ steps.version.outputs.version_id }}
    defaults:
      run:
        working-directory: onesignal-scheduler
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Upload preview version only
        run: npx wrangler versions upload --preview-alias safe-commercial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-output.ndjson
      - name: Capture uploaded version id
        id: version
        shell: python
        run: |
          import json,os
          rows=[]
          for line in open('/tmp/wrangler-output.ndjson',encoding='utf-8'):
              try: rows.append(json.loads(line))
              except Exception: pass
          candidates=[r for r in rows if r.get('type')=='version-upload' and r.get('version_id')]
          if not candidates: raise SystemExit('Version ID não encontrado')
          vid=candidates[-1]['version_id']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out: out.write(f'version_id={vid}\n')
          print('TEST_VERSION_ID='+vid)
      - name: Confirm preview is protected or reachable
        shell: python
        run: |
          import json,urllib.error,urllib.request
          url='https://safe-commercial-rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/preview-health'
          try:
              with urllib.request.urlopen(url,timeout=15) as r: b=json.loads(r.read())
              assert b.get('preview') is True and b.get('dryRun') is True
              print('Preview reachable: OK')
          except urllib.error.HTTPError as e:
              assert e.code==403
              print('Preview protected by Access: OK')

  live-group-smoke:
    needs: [safety-gate, preview-upload]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onesignal-scheduler
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_VERSION_ID: ${{ needs.preview-upload.outputs.version_id }}
      BASE_VERSION_ID: 8ed3c8cd-02e0-46aa-b29c-2de0282cde31
      WORKER_NAME: rotina-family-onesignal-scheduler
      PROD_URL: https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev
      TEST_GROUP_ID: CLI-6143
      SCORE_GROUP_ID: CLI-4071
      SCORE_DATE: '2026-08-21'
      SCORE_NAME: Estudar
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Restore exact baseline first
        run: npx wrangler versions deploy "$BASE_VERSION_ID@100%" -y
      - name: Real smoke tests at zero normal traffic
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEST_VERSION_ID"
          restore() {
            echo 'Restoring baseline 100%...'
            npx wrangler versions deploy "$BASE_VERSION_ID@100%" -y >/tmp/restore.log 2>&1 || { cat /tmp/restore.log; return 1; }
          }
          trap restore EXIT
          npx wrangler versions deploy "$TEST_VERSION_ID@0%" "$BASE_VERSION_ID@100%" -y
          sleep 10
          OVERRIDE="${WORKER_NAME}=\"${TEST_VERSION_ID}\""

          echo '1/3 — Testing real group detail...'
          curl --silent --show-error --max-time 35 \
            "$PROD_URL/preview-selftest/group?grupoId=$TEST_GROUP_ID" \
            -H "Cloudflare-Workers-Version-Overrides: $OVERRIDE" \
            -o /tmp/group.json
          cat /tmp/group.json; echo
          python - <<'PY'
          import json
          body=json.load(open('/tmp/group.json',encoding='utf-8'))
          assert body.get('selfTestVersion')==3, body
          assert body.get('ok') is True, body
          assert body.get('groupId')=='CLI-6143', body
          assert body.get('principalFound') is True, body
          print('REAL_GROUP_ROUTE_OK')
          PY

          echo '2/3 — Testing real commercial storage transitions in disposable group...'
          curl --silent --show-error --max-time 35 \
            "$PROD_URL/preview-selftest/commercial-storage" \
            -H "Cloudflare-Workers-Version-Overrides: $OVERRIDE" \
            -o /tmp/commercial.json
          cat /tmp/commercial.json; echo
          python - <<'PY'
          import json
          body=json.load(open('/tmp/commercial.json',encoding='utf-8'))
          assert body.get('ok') is True, body
          assert body.get('expiredState')=='teste-expirado', body
          assert body.get('confirmedState')=='confirmado', body
          assert body.get('blockedState')=='bloqueado', body
          print('REAL_COMMERCIAL_STORAGE_OK')
          PY

          echo '3/3 — Inspecting real same-name score reviews in CLI-4071...'
          curl --silent --show-error --max-time 35 --get \
            "$PROD_URL/preview-selftest/score-review" \
            --data-urlencode "grupoId=$SCORE_GROUP_ID" \
            --data-urlencode "data=$SCORE_DATE" \
            --data-urlencode "nome=$SCORE_NAME" \
            -H "Cloudflare-Workers-Version-Overrides: $OVERRIDE" \
            -o /tmp/score-review.json
          cat /tmp/score-review.json; echo
          python - <<'PY'
          import json
          body=json.load(open('/tmp/score-review.json',encoding='utf-8'))
          assert body.get('ok') is True, body
          assert body.get('groupId')=='CLI-4071', body
          print('SCORE_REVIEW_DIAGNOSTIC_OK count=', body.get('count'))
          PY

          restore
          trap - EXIT
          echo 'SMOKE REAL COMPLETO OK; baseline restaurado.'
