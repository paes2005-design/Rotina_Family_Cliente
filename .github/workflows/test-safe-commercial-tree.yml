name: Teste comercial seguro

on:
  push:
    branches:
      - teste-arvore-comercial-segura-2026-08-20
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onesignal-scheduler
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Existing regression suite
        run: npm run check && npm test

      - name: Commercial policy tests
        run: node test/commercial-safety.test.mjs

      - name: Syntax check safe modules
        run: |
          node --check src/commercial-policy.js
          node --check src/commercial-safe-entry.js
          node --check src/commercial-preview-entry.js
          node --check src/master-user-actions-fallback.js
          node --check src/master-user-actions-preview.js
          node --check src/master-rate-limit-entry.js
          node --check src/test-console.js

      - name: Architecture invariants
        shell: python
        run: |
          from pathlib import Path
          import re

          safe = Path('src/commercial-safe-entry.js').read_text(encoding='utf-8')
          preview = Path('src/commercial-preview-entry.js').read_text(encoding='utf-8')
          policy = Path('src/commercial-policy.js').read_text(encoding='utf-8')
          entry = Path('src/master-rate-limit-entry.js').read_text(encoding='utf-8')
          actions = Path('src/master-user-actions-fallback.js').read_text(encoding='utf-8')
          actions_preview = Path('src/master-user-actions-preview.js').read_text(encoding='utf-8')
          console = Path('src/test-console.js').read_text(encoding='utf-8')
          wrangler = Path('wrangler.jsonc').read_text(encoding='utf-8')

          assert "import app from './commercial-preview-entry.js'" in entry
          assert 'handleMasterUserActionPreview' in entry
          assert 'mustMutateFirebaseAuthForFamilyBlock' in policy
          assert 'return false' in policy.split('mustMutateFirebaseAuthForFamilyBlock',1)[1]

          master = re.search(r'async function requireMasterSafe\(.*?\n\}', safe, re.S)
          assert master, 'requireMasterSafe ausente'
          assert 'adminByUid' not in master.group(0), 'Master voltou a depender de administradores'
          assert 'isMasterEmail' in master.group(0)

          group = re.search(r"if \(request.method === 'POST' && url.pathname.endsWith\('/groups'\)\) \{.*?\n  \}", safe, re.S)
          assert group, 'rota /groups ausente'
          text = group.group(0)
          for forbidden in ['disableUser', "'/accounts:update'", 'setGroupDisabled']:
              assert forbidden not in text, f'Bloqueio familiar toca Auth: {forbidden}'
          assert 'familyBlockPatch' in text
          assert 'upsertConfig' in text

          assert "url.pathname === '/admin-master/admin-access'" in safe
          assert 'bloqueadoComercialIndividual' in safe
          assert "'/accounts:lookup'" in actions, 'Ações Master reais usam Authentication como fonte'

          assert 'COMMERCIAL_TEST_DRY_RUN' in preview
          assert 'COMMERCIAL_TEST_DRY_RUN' in actions_preview
          assert 'Nenhum dado foi alterado' in preview
          assert 'Nenhum login foi alterado' in actions_preview
          assert '/test-console' in preview
          assert 'TESTE COMERCIAL SEGURO' in console
          assert 'signInWithPassword' in console
          assert 'A senha é enviada diretamente' in console
          assert '"preview_urls": true' in wrangler
          assert '"COMMERCIAL_TEST_DRY_RUN": "1"' in wrangler
          for secret in ['MASTER_ADMIN_EMAILS','GOOGLE_SERVICE_ACCOUNT_JSON','APP_LOG_ENCRYPTION_KEY','ONESIGNAL_REST_API_KEY']:
              assert secret in wrangler, f'Secret obrigatório não declarado: {secret}'

          print('Arquitetura comercial segura + dry-run + console: OK')

      - name: Dry-run bundle validation
        run: npx wrangler versions upload --dry-run

  preview-upload:
    needs: safety-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onesignal-scheduler
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Upload preview version only
        run: npx wrangler versions upload --preview-alias safe-commercial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check preview routing or Access protection
        shell: python
        run: |
          import json, urllib.error, urllib.request

          url = 'https://safe-commercial-rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/preview-health'
          try:
              with urllib.request.urlopen(url, timeout=15) as response:
                  body = json.loads(response.read().decode('utf-8'))
              assert body.get('preview') is True, body
              assert body.get('dryRun') is True, body
              print('Preview público respondeu em dry-run: OK')
          except urllib.error.HTTPError as error:
              if error.code != 403:
                  raise
              print('Preview protegido por Cloudflare Access (HTTP 403): OK')
              print('O teste humano deve autenticar no Access antes de abrir /test-console.')
      - name: Confirm no production deployment
        run: echo "Preview version validated. Production deployment was not changed."

  manual-preview-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Read recent Cloudflare telemetry
        shell: python
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          import json, os, time, urllib.request, urllib.error

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          now = int(time.time() * 1000)
          start = now - 60 * 60 * 1000
          endpoint = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/observability/telemetry/query'
          payload = {
              'queryId': 'rotina-family-preview-manual-audit',
              'timeframe': {'from': start, 'to': now},
              'limit': 200,
              'dry': True,
              'parameters': {
                  'datasets': [],
                  'filterCombination': 'and',
                  'filters': [{
                      'key': '$metadata.service',
                      'operation': 'eq',
                      'type': 'string',
                      'value': 'rotina-family-onesignal-scheduler'
                  }],
                  'view': 'events'
              }
          }
          req = urllib.request.Request(endpoint, data=json.dumps(payload).encode(), method='POST', headers={
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json'
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = json.loads(response.read().decode())
          except urllib.error.HTTPError as error:
              print('OBSERVABILITY_HTTP='+str(error.code))
              print(error.read().decode('utf-8','replace')[:1500])
              raise

          events = (raw.get('result') or {}).get('events') or []
          matches = []
          for event in events:
              text = json.dumps(event, ensure_ascii=False).lower()
              if any(term in text for term in ['/admin-master/tree','/admin-master/users','/admin-master/logs','/test-console','429','listagem firestore recusada']):
                  matches.append(event)

          print('EVENT_COUNT='+str(len(events)))
          print('MATCH_COUNT='+str(len(matches)))
          for index,event in enumerate(matches[:50],1):
              text=json.dumps(event,ensure_ascii=False,sort_keys=True)
              for marker in ['authorization','password','senha','cookie']:
                  if marker in text.lower():
                      text='[EVENT REDACTED: sensitive field present]'
                      break
              print(f'--- MATCH_{index} ---')
              print(text[:3000])
