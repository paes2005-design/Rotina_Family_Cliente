name: Normalizar Participante e OneSignal 2026-08-27

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/normalize-participant-telemetry-20260827.py'
      - '.github/workflows/normalize-participant-telemetry-20260827.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar normalização
        run: python scripts/normalize-participant-telemetry-20260827.py
      - name: Validar sintaxe e invariantes
        run: |
          set -euo pipefail
          node --check app-monitoring.js
          node --check runtime-build-info.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          m=Path('app-monitoring.js').read_text(encoding='utf-8')
          h=Path('index-CLIENTE-v6.html').read_text(encoding='utf-8')
          e=Path('index.html').read_text(encoding='utf-8')
          r=Path('runtime-build-info.js').read_text(encoding='utf-8')
          assert "const APP_KIND = 'participante';" in m
          assert "aplicativo:'participante'" in h
          assert h.count('OneSignal.login(')==1
          assert "const BUILD='20260827.5';" in e
          assert "app:'PARTICIPANTE'" in r
          print('VALIDACAO_PARTICIPANTE=OK')
          PY
          cd onesignal-scheduler
          npm test
      - name: Persistir alterações
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-monitoring.js index-CLIENTE-v6.html index.html sw.js runtime-build-info.js
          if git diff --cached --quiet; then
            echo 'Normalização já aplicada.'
          else
            git commit -m "Normalizar app Participante e evitar login duplicado OneSignal"
            git push origin HEAD:main
          fi
