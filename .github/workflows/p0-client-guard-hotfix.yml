name: P0 client guard observer hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-client-guard-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove observer and validate
        shell: python
        run: |
          from pathlib import Path
          p=Path('client-offline-execution-integrity-v1.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("    const bodyObserver = new MutationObserver(() => applyLocksToDom());\n    const body = document.body;\n    if (body) bodyObserver.observe(body, { childList: true, subtree: true });\n","")
          p.write_text(s,encoding='utf-8')
      - run: |
          node --check client-offline-execution-integrity-v1.js
          ! grep -q 'bodyObserver' client-offline-execution-integrity-v1.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client-offline-execution-integrity-v1.js
          git diff --cached --quiet || git commit -m "Remove broad observer from offline integrity guard"
          git push origin main
