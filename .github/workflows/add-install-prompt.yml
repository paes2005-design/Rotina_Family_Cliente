name: Add install prompt
on:
  push:
    paths:
      - .github/workflows/add-install-prompt.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Cliente install prompt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-CLIENTE-v6.html')
          s=p.read_text()
          marker='</body>'
          assert marker in s
          if 'pwaInstallBanner' not in s:
              block=r'''
<div id="pwaInstallBanner" style="display:none;position:fixed;left:16px;right:16px;bottom:18px;z-index:9999;background:#fff;border:1px solid #ffd3dc;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:14px 16px;max-width:520px;margin:auto;font-family:inherit">
  <div style="display:flex;align-items:center;gap:12px">
    <img src="icon-cliente-192.png" alt="Ícone" width="48" height="48" style="border-radius:12px">
    <div style="flex:1"><strong style="display:block;color:#a4133c">Instalar Rotina Family</strong><small id="pwaInstallTexto" style="color:#666">Instale para acessar mais rápido e usar recursos offline.</small></div>
    <button id="pwaInstallBtn" style="border:0;background:#ff4d6d;color:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer">Instalar</button>
    <button id="pwaInstallFechar" aria-label="Fechar" style="border:0;background:transparent;font-size:20px;cursor:pointer;color:#777">×</button>
  </div>
</div>
<script>
(() => {
  let deferredPrompt=null;
  const banner=document.getElementById('pwaInstallBanner');
  const btn=document.getElementById('pwaInstallBtn');
  const fechar=document.getElementById('pwaInstallFechar');
  const texto=document.getElementById('pwaInstallTexto');
  const standalone=window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  const dispensado=sessionStorage.getItem('pwaInstallDismissed')==='1';
  if(standalone || dispensado) return;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferredPrompt=e; banner.style.display='block';
  });
  btn.addEventListener('click', async () => {
    if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; banner.style.display='none'; return; }
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    if(ios){ texto.textContent='No Safari: toque em Compartilhar e depois em “Adicionar à Tela de Início”.'; btn.style.display='none'; }
  });
  fechar.addEventListener('click',()=>{ banner.style.display='none'; sessionStorage.setItem('pwaInstallDismissed','1'); });
  window.addEventListener('appinstalled',()=>{ banner.style.display='none'; deferredPrompt=null; });
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios){ banner.style.display='block'; texto.textContent='Instale no iPhone/iPad para acesso rápido.'; }
})();
</script>
'''
              s=s.replace(marker,block+marker)
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-CLIENTE-v6.html
          git commit -m "Add visible PWA install prompt to Cliente"
          git pull --rebase origin main
          git push
