name: Add install prompt
on:
  push:
    paths:
      - .github/workflows/add-install-prompt.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Cliente
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index-CLIENTE-v6.html')
          s=p.read_text()
          payload=''
          if 'pwaInstallBanner' not in s:
              block=base64.b64decode(payload).decode()
              s=s.replace('</body>',block+'</body>')
              p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-CLIENTE-v6.html
          git commit -m "Add visible PWA install prompt to Cliente"
          git pull --rebase origin main
          git push
