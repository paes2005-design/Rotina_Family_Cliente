name: Inspecionar preview manual

on:
  push:
    branches:
      - teste-arvore-comercial-segura-2026-08-20
    paths:
      - .github/workflows/inspect-preview-observability.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inspect-preview-observability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query Cloudflare Workers Observability
        shell: python
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          import json, os, time, urllib.request, urllib.error

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          now = int(time.time() * 1000)
          start = now - 30 * 60 * 1000
          endpoint = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/observability/telemetry/query'
          payload = {
              'queryId': 'rotina-family-preview-manual-audit-v2',
              'timeframe': {'from': start, 'to': now},
              'limit': 500,
              'dry': True,
              'parameters': {
                  'datasets': [],
                  'filterCombination': 'and',
                  'filters': [],
                  'view': 'events'
              }
          }
          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json'
              }
          )

          def redact(value, key=''):
              forbidden = ('authorization','token','secret','password','senha','credential','cookie','email')
              if any(word in key.lower() for word in forbidden):
                  return '[REDACTED]'
              if isinstance(value, dict):
                  return {k: redact(v, k) for k, v in value.items()}
              if isinstance(value, list):
                  return [redact(v, key) for v in value[:80]]
              if isinstance(value, str) and len(value) > 700:
                  return value[:700] + '…'
              return value

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = json.loads(response.read().decode('utf-8'))
          except urllib.error.HTTPError as error:
              body = error.read().decode('utf-8', 'replace')
              print(f'OBSERVABILITY_HTTP={error.code}')
              print(body[:2000])
              raise

          result = raw.get('result') or {}
          events = result.get('events') or []
          print(f'OBSERVABILITY_OK=true')
          print(f'EVENT_COUNT={len(events)}')

          terms = [
              '/admin-master/group', '/admin-master/groups', '/admin-master/logs',
              'master_groups', 'master_group', 'safe-commercial', 'http 500',
              'statuscode":500', 'status":500', 'exception', 'error'
          ]
          interesting = []
          for event in events:
              text = json.dumps(event, ensure_ascii=False).lower()
              if any(term in text for term in terms):
                  interesting.append(event)

          print(f'INTERESTING_COUNT={len(interesting)}')
          for index, event in enumerate(interesting[:100], 1):
              print(f'--- PREVIEW_EVENT_{index} ---')
              print(json.dumps(redact(event), ensure_ascii=False, sort_keys=True))

          if not interesting and events:
              print('No matching event. Showing redacted samples to identify preview metadata.')
              for index, event in enumerate(events[:15], 1):
                  print(f'--- SAMPLE_EVENT_{index} ---')
                  print(json.dumps(redact(event), ensure_ascii=False, sort_keys=True))
