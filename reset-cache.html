<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Recuperar Rotina Family</title><meta name="theme-color" content="#ff4d6d"><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff0f3;color:#590d22;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.box{max-width:480px;width:100%;background:#fff;border:1px solid #ffb3c1;border-radius:20px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.10);text-align:center}.ico{font-size:48px}.status{margin:16px 0;padding:12px;border-radius:12px;background:#f8fafc;color:#475569}.ok{background:#ecfdf5;color:#166534}.err{background:#fef2f2;color:#991b1b}button{border:0;border-radius:12px;padding:12px 16px;background:#ff4d6d;color:#fff;font-weight:800;font-size:16px;cursor:pointer;width:100%}</style></head><body><main class="box"><div class="ico">🛠️</div><h1>Recuperando o aplicativo</h1><p>Esta tela remove somente o cache principal travado do Rotina Family. Seus dados e o serviço de notificações não são apagados.</p><div id="status" class="status">Iniciando limpeza segura…</div><button id="btn" type="button" style="display:none">Abrir aplicativo</button></main><script>(async()=>{const s=document.getElementById('status'),b=document.getElementById('btn');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();const root=new URL('./',location.href).href;await Promise.all(regs.filter(r=>r.scope===root).map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('rotina-family-cliente-')).map(k=>caches.delete(k)));}s.className='status ok';s.textContent='Cache travado removido. O aplicativo será aberto na versão estável.';b.style.display='block';b.onclick=()=>location.replace('./index.html?rescue='+Date.now());setTimeout(()=>b.click(),900);}catch(e){s.className='status err';s.textContent='Não foi possível limpar automaticamente. Toque no botão abaixo para abrir a versão estável.';b.style.display='block';b.onclick=()=>location.replace('./index.html?rescue='+Date.now());}})();</script></body></html>
