<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotina Family</title>
  <style>body{font-family:Segoe UI,Tahoma,sans-serif;background:#fff0f3;color:#590d22;margin:0;display:grid;place-items:center;min-height:100vh}.loading{padding:24px;text-align:center}</style>
</head>
<body>
  <div class="loading">Carregando Rotina Family...</div>
  <script>
    (async()=>{
      const BUILD='20260910.3';
      try{
        const r=await fetch(`./index-CLIENTE-v6.html?build=${BUILD}`,{cache:'no-store'});
        if(!r.ok)throw new Error(`Falha ao carregar aplicativo: HTTP ${r.status}`);
        let html=await r.text();
        html=html
          .replace('./app-monitoring.js?v=2','./app-monitoring.js?v=6')
          .replace('./client-ui-pro.js?v=44','./client-ui-pro.js?v=50')
          .replace("navigator.serviceWorker.register('./sw.js?v=30')","navigator.serviceWorker.register('./sw.js?v=84',{updateViaCache:'none'})");

        const bootstrap='<script src="./client-bootstrap-v1.js?v=20260910.3"><\/script>';
        if(!html.includes('client-bootstrap-v1.js'))html=html.replace('</body>',bootstrap+'\n</body>');

        html=html.replace('</body>',`<script>window.__ROTINA_BUILD='${BUILD}';window.rotinaLog?.('app.build_ativo',{build:'${BUILD}',release:'sprint2.1-alarm-single-owner-v15',bootstrap:1,participantStore:1,firebaseRepository:1,alarmRuntime:15,authVersion:6,offlineIntegrity:4,uiPro:50,serviceWorkerExpected:84,catVisual:'2d',catSadVisual:'2d-aprovado-novo'});<\/script>\n</body>`);
        document.open();document.write(html);document.close();
      }catch(e){
        document.body.innerHTML='<div class="loading"><strong>Não foi possível abrir o aplicativo.</strong><br><button onclick="location.reload()" style="margin-top:14px;padding:10px 16px;border:0;border-radius:10px">Tentar novamente</button></div>';
      }
    })();
  </script>
</body>
</html>
