<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotina Family</title>
  <style>body{font-family:Segoe UI,Tahoma,sans-serif;background:#fff0f3;color:#590d22;margin:0;display:grid;place-items:center;min-height:100vh}.loading{padding:24px;text-align:center}</style>
</head>
<body>
  <div class="loading">Carregando Rotina Family...</div>
  <script>
    (async()=>{
      const BUILD='20260826.2';
      try{
        const r=await fetch(`./index-CLIENTE-v6.html?build=${BUILD}`,{cache:'no-store'});
        if(!r.ok)throw new Error(`Falha ao carregar aplicativo: HTTP ${r.status}`);
        let html=await r.text();
        html=html
          .replace('./app-monitoring.js?v=2','./app-monitoring.js?v=5')
          .replace('./client-ui-pro.js?v=44','./client-ui-pro.js?v=45')
          .replace("navigator.serviceWorker.register('./sw.js?v=30')","navigator.serviceWorker.register('./sw.js?v=72',{updateViaCache:'none'})");

        const authGate=`<script>(function(){
          let resolveReady;
          const ready=new Promise(r=>{resolveReady=r});
          window.__rotinaAuthBridgeReady=ready;
          window.__rotinaResolveAuthBridge=function(v){try{resolveReady(v||true)}catch(e){}};
          const timeout=()=>new Promise((_,reject)=>setTimeout(()=>reject(new Error('A autenticação segura não carregou. Feche e abra o aplicativo novamente.')),12000));
          window.conectarCliente=async function(){
            try{await Promise.race([ready,timeout()]);if(typeof window.rotinaLoginParticipanteSeguro!=='function')throw new Error('Login seguro indisponível.');return window.rotinaLoginParticipanteSeguro();}
            catch(e){alert(e.message||'Não foi possível preparar o acesso.');return false;}
          };
          window.rotinaRestaurarSessaoParticipante=async function(){
            const args=arguments;
            try{await Promise.race([ready,timeout()]);if(typeof window.__rotinaRestaurarSessaoParticipanteReal!=='function')throw new Error('Restauração segura indisponível.');return window.__rotinaRestaurarSessaoParticipanteReal.apply(window,args);}
            catch(e){console.warn('Ponte de autenticação não ficou pronta.',e);document.getElementById('telaApp')?.style.setProperty('display','none');document.getElementById('telaAuth')?.style.setProperty('display','block');return false;}
          };
          window.__rotinaAuthGateVersion=1;
        })();<\/script>`;
        html=html.replace('</body>',authGate+'\n</body>');

        const secureAuth='<script type="module" src="./client-auth-session-v1.js?v=2"><\/script>';
        if(!html.includes('client-auth-session-v1.js'))html=html.replace('</body>',secureAuth+'\n</body>');
        const emergencyCompensation='<script type="module" src="./client-emergency-compensation-20260826.js?v=1"><\/script>';
        if(!html.includes('client-emergency-compensation-20260826.js'))html=html.replace('</body>',emergencyCompensation+'\n</body>');
        const offlineIntegrity='<script type="module" src="./client-offline-execution-integrity-v1.js?v=2"><\/script>';
        if(!html.includes('client-offline-execution-integrity-v1.js'))html=html.replace('</body>',offlineIntegrity+'\n</body>');
        const commercial='<script type="module" src="./commercial-access-client.js?v=3"><\/script>';
        if(!html.includes('commercial-access-client.js'))html=html.replace('</body>',commercial+'\n</body>');
        const telemetry='<script src="./app-monitoring-extra-v1.js?v=3"><\/script>';
        if(!html.includes('app-monitoring-extra-v1.js'))html=html.replace('</body>',telemetry+'\n</body>');
        const mascotLayout='<script src="./client-mascot-layout-v1.js?v=4"><\/script>';
        if(!html.includes('client-mascot-layout-v1.js'))html=html.replace('</body>',mascotLayout+'\n</body>');
        const catAsset='<script src="./client-cat-asset-v4.js?v=6"><\/script>';
        if(!html.includes('client-cat-asset-v4.js'))html=html.replace('</body>',catAsset+'\n</body>');
        const catSafe='<script src="./client-cat-layout-safe-v5.js?v=5"><\/script>';
        if(!html.includes('client-cat-layout-safe-v5.js'))html=html.replace('</body>',catSafe+'\n</body>');
        const mascotFix='<script src="./client-mascot-fix-v6.js?v=6"><\/script>';
        if(!html.includes('client-mascot-fix-v6.js'))html=html.replace('</body>',mascotFix+'\n</body>');
        const catContainer='<script src="./client-cat-container-v7.js?v=9"><\/script>';
        if(!html.includes('client-cat-container-v7.js'))html=html.replace('</body>',catContainer+'\n</body>');
        const runtimeInfo='<script src="./runtime-build-info.js?v=20260826.2"><\/script>';
        if(!html.includes('runtime-build-info.js'))html=html.replace('</body>',runtimeInfo+'\n</body>');
        html=html.replace('</body>',`<script>window.__ROTINA_BUILD='${BUILD}';window.rotinaLog?.('app.build_ativo',{build:'${BUILD}',release:'cliente-clean-v77',authGate:1,authVersion:2,emergencyCompensation:1,offlineIntegrity:2,uiPro:45,serviceWorkerExpected:72,mascoteOverlay:4,catAssetFix:6,catLayoutSafe:5,mascoteFix:6,catContainer:8,catScale:1,catVisual:'2d',catSadVisual:'2d-aprovado-novo'});<\/script>\n</body>`);
        document.open();document.write(html);document.close();
      }catch(e){
        document.body.innerHTML='<div class="loading"><strong>Não foi possível abrir o aplicativo.</strong><br><button onclick="location.reload()" style="margin-top:14px;padding:10px 16px;border:0;border-radius:10px">Tentar novamente</button></div>';
      }
    })();
  </script>
</body>
</html>
